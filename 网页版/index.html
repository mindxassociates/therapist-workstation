<body>
<div id="lock" class="lock hidden"><div class="lockbox"><h1 id="lockTitle">心理咨询师工作台</h1><p class="sub" id="lockSub">输入启动密码进入工作台。</p><div id="setupName" class="field hidden"><label>咨询师姓名</label><input id="ownerName"></div><div class="field"><label>启动密码</label><div class="pwrow"><input id="lockPassword" type="password" autocomplete="current-password"><button class="eye" type="button" onclick="togglePw('lockPassword',this)">◉</button></div><div id="caps" class="caps hidden">大写锁定已开启</div></div><div id="confirmWrap" class="field hidden"><label>再次输入密码</label><div class="pwrow"><input id="lockConfirm" type="password"><button class="eye" type="button" onclick="togglePw('lockConfirm',this)">◉</button></div></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="unlock()">继续</button><p id="lockError" class="dangertext"></p><div class="notice">启动密码用于减少他人直接查看本页面数据的风险，并非数据库级加密。数据保存在当前浏览器的本地存储中，请定期导出备份。</div></div></div>
<div class="app">
<header class="top"><div class="brand" title="返回今日工作台" role="button" tabindex="0" onclick="go('today')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('today')}">✦</div><nav class="nav">
<button data-page="today" onclick="go('today')">今日工作台</button><button data-page="calendar" onclick="go('calendar')">日程</button><button data-page="clients" onclick="go('clients')">来访者</button><button data-page="tasks" onclick="go('tasks')">任务看板</button>
<div class="dropdown"><button class="dropbtn" onclick="drop(this)">记录 ▾</button><div class="dropdown-menu"><button onclick="go('sessions')">咨询记录</button><button onclick="go('goals')">咨询目标</button><button onclick="go('notes')">随手记</button><button onclick="go('templates')">记录模板</button></div></div>
<div class="dropdown"><button class="dropbtn" onclick="drop(this)">管理 ▾</button><div class="dropdown-menu"><button onclick="go('finance')">收费</button><button onclick="go('recent')">最近查看</button><button onclick="go('archive')">归档</button><button onclick="go('search')">全局搜索</button><button onclick="go('referrals')">转介网络</button><button onclick="go('assessments')">量表评估</button><button onclick="go('waitlist')">候补名单</button><button onclick="go('insights')">数据洞察</button></div></div>
<div class="dropdown"><button class="dropbtn" onclick="drop(this)">设置 ▾</button><div class="dropdown-menu"><button onclick="go('data')">数据中心</button><button onclick="go('settings')">个性化设置</button><button onclick="go('privacy')">隐私与合规</button></div></div>

function editSession(id='',eventId='',clientId='',forceEdit=false){let s=id?S.sessions.find(x=>x.id===id):null,e=eventId?S.events.find(x=>x.id===eventId):null,d=!id?S.sessionDrafts.find(x=>(eventId&&x.eventId===eventId)||(!eventId&&clientId&&x.clientId===clientId)):null;let x=s||d||{id:uid(),clientId:clientId||e?.clientId||'',eventId:eventId||'',date:e?.date||dateToday(),mode:e?.mode||'视频',duration:'50',content:'',recordStatus:'草稿'},locked=!!(s&&(s.locked||s.recordStatus==='已锁定')&&!forceEdit);modal(`${locked?'<div class="notice">此记录已锁定，当前为只读。点击「重新编辑」后才能修改。</div>':''}<h2>${id?'咨询记录':'新建咨询记录'}</h2><div class="formgrid"><div class="field"><label>来访者</label><select id="sClient" onchange="sessionDraft()">${opts(x.clientId,false)}</select></div><div class="field"><label>咨询日期</label><input id="sDate" type="date" value="${esc(x.date||'')}" oninput="sessionDraft()"></div><div class="field"><label>咨询形式</label><select id="sMode" onchange="sessionDraft()">${['视频','面询','电话','其他'].map(v=>`<option ${x.mode===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>咨询时长（分钟）</label><input id="sDuration" value="${esc(x.duration||'')}" oninput="sessionDraft()"></div><div class="field"><label>记录状态</label><select id="sRecordStatus" onchange="sessionDraft()">${['草稿','已完成','已锁定'].map(v=>`<option ${x.recordStatus===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><div class="row" style="justify-content:space-between"><label>咨询笔记</label><div class="row"><select id="templatePick"><option value="">自由书写（默认）</option><optgroup label="内置参考模板">${BUILTIN_TEMPLATES.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</optgroup>${S.templates.length?`<optgroup label="我的模板">${S.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</optgroup>`:''}</select><button class="btn" onclick="applyTemplate()">套用</button><button class="btn" onclick="copyPrevious()">从前次咨询记录复制</button><button class="btn" onclick="toggle function sessionDraft(){clearTimeout(autosaveTimer);let st=document.getElementById('sessionStatus');if(st)st.textContent='正在保存草稿…';autosaveTimer=setTimeout(()=>{let x={id:'draft-'+(window._sessionEvent||sClient.value),eventId:window._sessionEvent||'',clientId:sClient.value,date:normDate(sDate.value),mode:sMode.value,duration:sDuration.value,content:sessionEditor.innerHTML,recordStatus:(document.getElementById('sRecordStatus')?.value||'草稿'),updatedAt:Date.now()};S.sessionDrafts=S.sessionDrafts.filter(d=>d.id!==x.id);S.sessionDrafts.unshift(x);save();if(st)st.textContent='已自动保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})},900)}

function applyTemplate(){let id=templatePick.value;if(!id)return;let t=BUILTIN_TEMPLATES.find(x=>x.id===id)||S.templates.find(x=>x.id===id);if(t){sessionEditor.innerHTML=t.content;sessionDraft()}}

function renderTemplates(){document.getElementById('templates').innerHTML=head('咨询记录模板','咨询记录默认使用自由书写；需要时可套用内置参考模板或自定义模板。','<button class="btn primary" onclick="editTemplate()">+ 新建模板</button>')+`<div class="card"><h3 class="section-title">内置参考模板</h3>${BUILTIN_TEMPLATES.map(t=>`<div class="item"><div><b>${esc(t.name)}</b><div class="meta">仅供记录结构参考，不自动作为默认记录格式。</div></div></div>`).join('')}</div><div class="card"><h3 class="section-title">我的模板</h3>${S.templates.length?S.templates.map(t=>`<div class="item"><b>${esc(t.name)}</b><button class="btn" onclick="editTemplate('${t.id}')">编辑</button></div>`).join(''):empty('还没有自定义模板。')}</div>`}

let noteQuery='',noteClientFilter='';
const noteColors=[['default','#fffdf7','默认'],['sand','#f6edcf','米黄'],['sage','#dfead9','鼠尾草绿'],['blue','#dcebf2','雾蓝'],['lavender','#e9e0f0','淡紫'],['rose','#f2dfe3','浅粉'],['clay','#edd9cf','陶土'],['gray','#e6e8e8','浅灰']];
function noteColorValue(k){return (noteColors.find(x=>x[0]===k)||noteColors[0])[1]}
function renderNotes(){let arr=[...S.quickNotes].filter(n=>(!noteClientFilter||n.clientId===noteClientFilter)&&(!noteQuery||(`${n.title||''} ${n.issues||''} ${n.content||''} ${cname(n.clientId)}`).toLowerCase().includes(noteQuery.toLowerCase()))).sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||((b.updatedAt||0)-(a.updatedAt||0)));let pinned=arr.filter(n=>n.pinned),other=arr.filter(n=>!n.pinned);let board=a=>a.length?`<div class="note-board">${a.map(noteCard).join('')}</div>`:empty('这里还没有随手记。');document.getElementById('notes').innerHTML=head('随手记','卡片式瀑布流，用颜色、置顶和筛选快速整理临时笔记。','<button class="btn primary" onclick="editNote()">+ 新建随手记</button>')+`<div class="note-controls"><input style="max-width:360px" placeholder="搜索标题、内容或议题…" value="${esc(noteQuery)}" oninput="noteQuery=this.value;renderNotes()"><select style="max-width:260px" onchange="noteClientFilter=this.value;renderNotes()"><option value="">全部来访者与一般笔记</option>${S.clients.filter(c=>c.status!=='归档').map(c=>`<option value="${c.id}" ${c.id===noteClientFilter?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>${pinned.length?`<div class="note-section-label">置顶</div>${board(pinned)}`:''}<div class="note-section-label">${pinned.length?'其他':'全部随手记'}</div>${board(other)}`}
function noteCard(n){let text=esc(n.content||'').replace(/\n/g,'<br>');return `<article class="note-card" style="background:${noteColorValue(n.color)}" onclick="editNote('${n.id}')"><span class="pin">${n.pinned?'◆':''}</span><h3>${esc(n.title||'无标题')}</h3><div class="note-card-body">${text||'<span class="meta">空白笔记</span>'}</div>${n.issues?`<div style="margin-top:9px">${fmtIssues(n.issues)}</div>`:''}<div class="note-card-foot">${n.clientId?esc(cname(n.clientId))+' · ':''}${n.updatedAt?new Date(n.updatedAt).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):''}</div></article>`}
function editNote(id=''){let n=S.quickNotes.find(x=>x.id===id)||S.noteDrafts.find(x=>x.id===id)||{id:id||uid(),title:'',clientId:'',issues:'',content:'',color:'default',pinned:false};modal(`<h2>随手记</h2><div class="formgrid"><div class="field"><label>标题</label><input id="nTitle" value="${esc(n.title)}" oninput="noteDraft('${n.id}')"></div><div class="field"><label>关联来访者（可选）</label><select id="nClient" onchange="noteDraft('${n.id}')">${opts(n.clientId)}</select></div><div class="field full"><label>议题（用逗号分隔）</label><input id="nIssues" value="${esc(n.issues||'')}" oninput="noteDraft('${n.id}')"></div><div class="field full"><label>卡片颜色</label><div class="note-color-choices">${noteColors.map(([k,v,name])=>`<button type="button" title="${name}" class="note-color ${(n.color||'default')===k?'selected':''}" style="--nc:${v}" data-color="${k}" onclick="pickNoteColor(this);noteDraft('${n.id}')"></button>`).join('')}<input type="hidden" id="nColor" value="${esc(n.color||'default')}"></div></div><div class="field full"><label><input id="nPinned" type="checkbox" ${n.pinned?'checked':''} onchange="noteDraft('${n.id}')" style="width:auto"> 置顶这条随手记</label></div><div class="field full"><label>内容</label><textarea id="nContent" oninput="noteDraft('${n.id}')" style="min-height:300px">${esc(n.content)}</textarea><div class="save-status" id="noteStatus"></div></div></div>${foot(`saveNote('${n.id}')`,'保存')}`)}
function pickNoteColor(b){document.querySelectorAll('.note-color').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');nColor.value=b.dataset.color}
function noteDraft(id){clearTimeout(autosaveTimer);if(noteStatus)noteStatus.textContent='正在保存草稿…';autosaveTimer=setTimeout(()=>{let x={id,title:nTitle.value,clientId:nClient.value,issues:splitIssues(nIssues.value).join('，'),content:nContent.value,color:nColor.value,pinned:nPinned.checked,updatedAt:Date.now()};S.noteDrafts=S.noteDrafts.filter(n=>n.id!==id);S.noteDrafts.unshift(x);save();if(noteStatus)noteStatus.textContent='已自动保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})},900)}
function saveNote(id){let x={id,title:nTitle.value.trim(),clientId:nClient.value,issues:splitIssues(nIssues.value).join('，'),content:nContent.value,color:nColor.value,pinned:nPinned.checked,updatedAt:Date.now()};let i=S.quickNotes.findIndex(n=>n.id===id);if(i>=0)S.quickNotes[i]=x;else S.quickNotes.unshift(x);S.noteDrafts=S.noteDrafts.filter(n=>n.id!==id);save();markModalClean();closeModal(true);render();toast('✓ 已保存')}
let taskFilterValue='';
let taskQuick='',taskCategoryFilter='',editingSubtasks=[];
const TASK_CATEGORIES=['咨询记录','来访者跟进','行政事务','财务收费','督导学习','其他'];
function autoCategory(t){if(t.category)return t.category;let s=(t.title||'')+' '+(t.notes||'');if(/记录|纪要|个案|评估报告/.test(s))return '咨询记录';if(/收费|对账|发票|付款|费用|账单/.test(s))return '财务收费';if(/督导|培训|学习|读书|课程/.test(s))return '督导学习';if(/跟进|回访|联系|确认|提醒/.test(s))return '来访者跟进';if(/行政|材料|表格|注册|证件|合同/.test(s))return '行政事务';return '其他'}
function applyTaskStatus(t,status){let was=t.status;t.status=status;if(status==='已完成'&&was!=='已完成'){t.completedAt=new Date().toISOString();if(t.repeat&&t.repeat!=='不重复'&&!t.repeatSpawned){t.repeatSpawned=true;S.tasks.unshift({id:uid(),title:t.title,clientId:t.clientId,status:'待处理',due:t.due?nextRepeatDate(t.due,t.repeat,1):'',notes:t.notes,category:t.category,repeat:t.repeat,subtasks:(t.subtasks||[]).map(s=>({title:s.title,done:false})),completedAt:'',archived:false})}}if(status!=='已完成'){t.completedAt='';t.repeatSpawned=false}}
function sweepTaskArchive(){let cutoff=Date.now()-14*86400000,changed=false;S.tasks.forEach(t=>{if(t.status==='已完成'&&!t.archived&&t.completedAt&&new Date(t.completedAt).getTime()<cutoff){t.archived=true;changed=true}});if(changed)save()}
function dueBadge(t){if(!t.due||t.status==='已完成')return '';let today=dateToday();if(t.due<today){let days=Math.round((new Date(today+'T12:00:00')-new Date(t.due+'T12:00:00'))/86400000);return `<div class="meta" style="color:var(--danger);font-weight:700">已逾期 ${days} 天</div>`}if(t.due===today)return `<div class="meta" style="color:#b45309;font-weight:700">今天到期</div>`;return ''}
function toggleSubtask(id,i){let t=S.tasks.find(x=>x.id===id);if(!t||!t.subtasks||!t.subtasks[i])return;t.subtasks[i].done=!t.subtasks[i].done;save();renderTasks()}
function renderSubtaskEditor(){let box=document.getElementById('kSubtasks');if(!box)return;box.innerHTML=editingSubtasks.map((s,i)=>`<div class="row" style="margin-bottom:6px"><input type="checkbox" ${s.done?'checked':''} onchange="editingSubtasks[${i}].done=this.checked"><input value="${esc(s.title)}" oninput="editingSubtasks[${i}].title=this.value" placeholder="子任务内容" style="flex:1"><button class="btn danger" onclick="editingSubtasks.splice(${i},1);renderSubtaskEditor()">删除</button></div>`).join('')+`<button class="btn" onclick="addSubtask()">＋ 添加子任务</button>`}

function deleteTask(id){if(!confirm('确定删除这条已归档任务？'))return;S.tasks=S.tasks.filter(x=>x.id!==id);save();render();toast('任务已删除')}
function taskQuickMatch(t){if(!taskQuick)return true;let today=dateToday();if(taskQuick==='overdue')return t.status!=='已完成'&&!!t.due&&t.due<today;if(taskQuick==='today')return t.status!=='已完成'&&t.due===today;if(taskQuick==='week'){if(!t.due||t.status==='已完成')return false;let end=new Date(today+'T12:00:00');end.setDate(end.getDate()+7);return t.due>=today&&t.due<=localDate(end)}return true}
function renderTasks(){sweepTaskArchive();let statuses=['待处理','进行中','等待中','已完成'];let old=document.getElementById('taskFilter');if(old)taskFilterValue=old.value;let oldc=document.getElementById('taskCatFilter');if(oldc)taskCategoryFilter=oldc.value;let filtered=S.tasks.filter(t=>!t.archived&&(!taskFilterValue||t.clientId===taskFilterValue)&&(!taskCategoryFilter||t.category===taskCategoryFilter)&&taskQuickMatch(t));let chips=[['','全部'],['overdue','已逾期'],['today','今天到期'],['week','本周到期']].map(([k,n])=>`<button class="btn ${taskQuick===k?'primary':''}" onclick="taskQuick='${k}';renderTasks()">${n}</button>`).join('');document.getElementById('tasks').innerHTML=head('任务看板','按住任务卡片并拖到其他栏目即可更新状态；也可以点击栏目空白处直接新建任务。列内按截止日期排序；已完成任务保留 14 天后自动归档，可在「归档」页恢复。','<button class="btn primary" onclick="editTask()">+ 新建任务</button>')+`<div class="row" style="margin-bottom:12px">${chips}<select id="taskFilter" onchange="taskFilterValue=this.value;renderTasks()"><option value="">全部来访者与一般任务</option>${S.clients.filter(c=>c.status!=='归档').map(c=>`<option value="${c.id}" ${c.id===taskFilterValue?'selected':''}>${esc(c.name)}${c.dob?' · '+esc(c.dob):''}</option>`).join('')}</select><select id="taskCatFilter" onchange="taskCategoryFilter=this.value;renderTasks()"><option value="">全部分类</option>${TASK_CATEGORIES.map(c=>`<option ${c===taskCategoryFilter?'selected':''}>${c}</option>`).join('')}</select></div><div class="kanban">${statuses.map(st=>{let cards=filtered.filter(t=>t.status===st).sort((a,b)=>st==='已完成'?(b.completedAt||'').localeCompare(a.completedAt||''):(a.due||'9999-99').localeCompare(b.due||'9999-99'));return `<div class="col task-create-zone" data-status="${st}" onclick="newTaskFromColumn(event,'${st}')"><h3>${st}</h3>${cards.map(taskCard).join('')}${cards.length?'<div class="task-column-spacer" title="点击空白处添加任务"></div>':'<div class="task-empty-hint">＋ 点击空白处添加任务</div>'}</div>`}).join('')}</div>`}

function taskCard(t){let subs=t.subtasks||[],doneN=subs.filter(s=>s.done).length;return `<div class="task" data-task-id="${t.id}" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();editTask('${t.id}')}" onpointerdown="startTaskPointerDrag(event,'${t.id}')" onclick="openTaskFromCard(event,'${t.id}')"><b>${esc(t.title)}</b><div class="meta">${t.clientId?esc(cname(t.clientId)):'一般任务'} ${t.due?'· '+esc(t.due):''}</div>${dueBadge(t)}${(t.category||(t.repeat&&t.repeat!=='不重复'))?`<div class="meta">${t.category?'分类：'+esc(t.category):''}${t.repeat&&t.repeat!=='不重复'?' · 重复：'+esc(t.repeat):''}</div>`:''}${subs.length?`<div style="margin:6px 0">${subs.map((s,i)=>`<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" ${s.done?'checked':''} onclick="event.stopPropagation()" onchange="toggleSubtask('${t.id}',${i})"><span>${esc(s.title)}</span></label>`).join('')}<div class="meta">子任务 ${doneN}/${subs.length}</div><div style="height:5px;background:var(--line);border-radius:99px"><div style="height:100%;width:${Math.round(doneN/subs.length*100)}%;background:var(--accent);border-radius:99px"></div></div></div>`:''}<select onpointerdown="event.stopPropagation()" onclick="event.stopPropagation()" onchange="setTaskStatus('${t.id}',this.value)">${['待处理','进行中','等待中','已完成'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select><div class="row" style="margin-top:6px">${t.status==='已完成'?`<button class="btn" onclick="setTaskStatus('${t.id}','待处理')">重新打开</button>`:`<button class="btn primary" onclick="setTaskStatus('${t.id}','已完成')">✓ 完成</button>`}<button class="btn" onclick="archiveTask('${t.id}')">归档</button></div></div>`}

function editTask(id='',presetStatus=''){let t=S.tasks.find(x=>x.id===id)||{id:uid(),title:'',clientId:'',status:presetStatus||'待处理',due:'',notes:'',category:'',repeat:'不重复',subtasks:[]};editingSubtasks=JSON.parse(JSON.stringify(t.subtasks||[]));modal(`<h2>任务</h2><div class="formgrid"><div class="field full"><label>任务标题</label><input id="kTitle" value="${esc(t.title)}"></div><div class="field"><label>关联来访者（可选）</label><select id="kClient">${opts(t.clientId)}</select></div><div class="field"><label>状态</label><select id="kStatus">${['待处理','进行中','等待中','已完成'].map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>截止日期</label><input id="kDue" type="date" value="${esc(t.due||'')}"></div><div class="field"><label>分类</label><select id="kCategory"><option value="">自动归类</option>${TASK_CATEGORIES.map(x=>`<option ${x===t.category?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>重复</label><select id="kRepeat">${['不重复','每周','每两周','每月'].map(x=>`<option ${x===(t.repeat||'不重复')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>备注</label><textarea id="kNotes">${esc(t.notes||'')}</textarea></div><div class="field full"><label>子任务清单</label><div id="kSubtasks"></div></div></div>${foot(`saveTask('${t.id}')`,'保存')}`);renderSubtaskEditor()}

function saveTask(id){let old=S.tasks.find(t=>t.id===id);let x=Object.assign({},old||{},{id,title:kTitle.value.trim(),clientId:kClient.value,status:kStatus.value,due:normDate(kDue.value),notes:kNotes.value,category:kCategory.value,repeat:kRepeat.value,subtasks:editingSubtasks.filter(s=>s.title.trim()).map(s=>({title:s.title.trim(),done:!!s.done}))});if(!x.title)return alert('请填写任务标题。');if(!x.category)x.category=autoCategory(x);if(!old||old.status!==x.status)applyTaskStatus(x,x.status);let i=S.tasks.findIndex(t=>t.id===id);if(i>=0)S.tasks[i]=x;else S.tasks.unshift(x);save();markModalClean();closeModal(true);render();toast('✓ 已保存')}

let taskDrag=null;let taskPointerMoved=false;
function openTaskFromCard(e,id){if(taskPointerMoved){taskPointerMoved=false;return}if(e.target.closest('select,button,input,textarea'))return;editTask(id)}
function startTaskPointerDrag(e,id){
  if(e.button!==undefined && e.button!==0)return;
  if(e.target.closest('select,button,input,textarea'))return;
  let card=e.currentTarget, r=card.getBoundingClientRect();
  let ghost=card.cloneNode(true);
  ghost.style.position='fixed'; ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
  ghost.style.width=r.width+'px'; ghost.style.zIndex='9999'; ghost.style.pointerEvents='none';
  ghost.style.opacity='.88'; ghost.style.transform='rotate(1deg)';
  document.body.appendChild(ghost);
  card.classList.add('dragging');
  taskPointerMoved=false;taskDrag={id,card,ghost,dx:e.clientX-r.left,dy:e.clientY-r.top,startX:e.clientX,startY:e.clientY};
  card.setPointerCapture?.(e.pointerId);
  document.addEventListener('pointermove',moveTaskPointerDrag);
  document.addEventListener('pointerup',endTaskPointerDrag,{once:true});
  e.preventDefault();
}
function moveTaskPointerDrag(e){
  if(!taskDrag)return;
  if(Math.abs(e.clientX-taskDrag.startX)>5||Math.abs(e.clientY-taskDrag.startY)>5)taskPointerMoved=true;
  taskDrag.ghost.style.left=(e.clientX-taskDrag.dx)+'px';
  taskDrag.ghost.style.top=(e.clientY-taskDrag.dy)+'px';
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('drop-target'));
  let el=document.elementFromPoint(e.clientX,e.clientY);
  let col=el?.closest?.('.col');
  if(col)col.classList.add('drop-target');
}
function endTaskPointerDrag(e){
  if(!taskDrag)return;
  let el=document.elementFromPoint(e.clientX,e.clientY), col=el?.closest?.('.col');
  let id=taskDrag.id;
  taskDrag.card.classList.remove('dragging');
  taskDrag.ghost.remove();
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('drop-target'));
  taskDrag=null;
  document.removeEventListener('pointermove',moveTaskPointerDrag);
  if(taskPointerMoved&&col&&col.dataset.status)setTaskStatus(id,col.dataset.status);
}
function dragTask(e,id){e.dataTransfer.setData('text/plain',id);e.currentTarget.classList.add('dragging')}
function dropTask(e,status){e.preventDefault();let id=e.dataTransfer.getData('text/plain');setTaskStatus(id,status)}
function setTaskStatus(id,status){let t=S.tasks.find(x=>x.id===id);if(t){applyTaskStatus(t,status);save();render()}}
function renderCalendar(){document.getElementById('calendar').innerHTML=head('日程','默认北京时间；可在每条日程中选择其他时区。','<button class="btn primary" onclick="editEvent()">+ 添加日程</button>')+`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="tabs"><button class="${calView==='month'?'active':''}" onclick="calView='month';renderCalendar()">月</button><button class="${calView==='week'?'active':''}" onclick="calView='week';renderCalendar()">周</button><button class="${calView==='list'?'active':''}" onclick="calView='list';renderCalendar()">清单</button></div><div class="row"><button class="btn" onclick="calMove(-1)">‹</button><button class="btn" onclick="calToday()">今天</button><b>${calDate.getFullYear()}年 ${calDate.getMonth()+1}月</b><button class="btn" onclick="calMove(1)">›</button></div></div><div id="calBody">${calBody()}</div></div>`}

function calMove(n){if(calView==='week')calDate.setDate(calDate.getDate()+n*7);else calDate.setMonth(calDate.getMonth()+n);renderCalendar()}
function calBody(){if(calView==='list'){let a=[...S.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return a.length?a.map(eventItem).join(''):emptyAction('还没有日程。','＋ 添加日程',"editEvent()")}if(calView==='week'){let d=new Date(calDate),day=d.getDay()||7;d.setDate(d.getDate()-day+1);let hours=Array.from({length:13},(_,i)=>i+8);return `<div class="week">${Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);let ds=localDate(x),events=S.events.filter(e=>e.date===ds);return `<div class="weekcol" onclick="editEventOnDate('${ds}')"><div class="weekhead"><b>${ds}</b></div><div class="weekhours">${hours.map(h=>`<div class="hourline"><span class="hourlabel">${String(h).padStart(2,'0')}:00</span></div>`).join('')}</div>${events.length?`<div class="weekevents">${events.map(eventPill).join('')}</div>`:''}</div>`}).join('')}</div>`}let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells=Array(start).fill('<div></div>');for(let n=1;n<=days;n++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;cells.push(`<div class="day ${ds===dateToday()?'today-mark':''}" onclick="editEventOnDate('${ds}')" title="点击新增日程"><div class="num">${n}</div>${S.events.filter(e=>e.date===ds).map(eventPill).join('')}</div>`)}return `<div class="calgrid">${['一','二','三','四','五','六','日'].map(x=>`<b style="text-align:center">${x}</b>`).join('')}${cells.join('')}</div>`}
function localDate(d){let p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function eventPill(e){return `<div class="eventpill" style="border-left:3px solid ${eventStatusColor(e)}${e.status==='已取消'?';opacity:.55':''}" onclick="event.stopPropagation();editEvent('${e.id}')">${esc(e.time||'')} ${esc(e.title||e.type)}${e.status==='爽约'?'（爽约）':''}</div>`}

function editEvent(id='',cid='',presetDate=''){let e=S.events.find(x=>x.id===id)||{id:uid(),type:'心理咨询',title:'心理咨询',clientId:cid,date:presetDate||dateToday(),time:'',mode:'视频',timezone:S.settings.timezone||'Asia/Shanghai',notes:'',recurrence:'不重复',status:'已确认',videoLink:''};let fee=linkedFee(e.id)||{amount:'',status:'待收',method:'',notes:''};modal(`<h2>${id?'编辑日程':'添加日程'}</h2><div class="formgrid"><div class="field"><label>日程类型</label><select id="eType" onchange="toggleEventFee();if(this.value==='心理咨询'&&!eTitle.value)eTitle.value='心理咨询'">${['心理咨询','会议','个人事项','其他'].map(x=>`<option ${e.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>日程标题</label><input id="eTitle" value="${esc(e.title||'心理咨询')}"></div><div class="field"><label>关联来访者（可选）</label><select id="eClient" onchange="if(this.value&&eType.value==='心理咨询')eTitle.value='心理咨询'">${opts(e.clientId)}</select></div><div class="field"><label>咨询形式（可选）</label><select id="eMode">${['视频','面询','电话',''].map(x=>`<option value="${x}" ${e.mode===x?'selected':''}>${x||'不指定'}</option>`).join('')}</select></div><div class="field"><label>日期</label><input id="eDate" type="date" value="${esc(e.date)}"></div><div class="field"><label>时间</label><input id="eTime" type="time" value="${esc(e.time||'')}"></div><div class="field"><label>重复</label><select id="eRepeat">${['不重复','每周','每两周','每月'].map(v=>`<option ${e.recurrence===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>时区</label><select id="eTz">${[['Asia/Shanghai','北京时间（UTC+8）'],['America/Chicago','美国中部时间'],['America/New_York','美国东部时间'],['America/Los_Angeles','美国太平洋时间'],['Europe/London','伦敦时间']].map(([v,n])=>`<option value="${v}" ${e.timezone===v?'selected':''}>${n}</option>`).join('')}</select></div><div id="eventFeeBox" class="field full" style="display:${e.type==='心理咨询'?'block':'none'}"><div class="card" style="padding:14px"><h3 class="section-title">本次咨询费用</h3><div class="formgrid"><div class="field"><label>金 function toggleEventFee(){let b=document.getElementById('eventFeeBox');if(b)b.style.display=eType.value==='心理咨询'?'block':'none'}
function syncFeeForEvent(ev,sourceEventId=''){let create=document.getElementById('eFeeCreate')?.checked,amount=document.getElementById('eFeeAmount')?.value.trim()||'',status=document.getElementById('eFeeStatus')?.value||'待收',method=document.getElementById('eFeeMethod')?.value||'';let old=linkedFee(sourceEventId||ev.id);if(ev.type!=='心理咨询'||!ev.clientId){if(old){old.clientId=ev.clientId||old.clientId;old.date=ev.date}return}if(!create&&!old)return;if(!create&&old)return;let f=old||{id:uid(),eventId:ev.id,notes:''};Object.assign(f,{eventId:ev.id,clientId:ev.clientId,date:ev.date,amount,status,method});if(!old)S.finances.unshift(f)}
function syncSeriesFees(baseEvent){if(baseEvent.recurrence==='不重复'||!document.getElementById('eFeeCreate')?.checked)return;if(!confirm('是否将相同的费用设置应用到这组重复咨询的所有已生成日程？'))return;let sid=baseEvent.seriesId||baseEvent.id;S.events.filter(e=>(e.id===sid||e.seriesId===sid)&&e.type==='心理咨询'&&e.clientId).forEach(e=>{let f=linkedFee(e.id)||{id:uid(),eventId:e.id,notes:''};Object.assign(f,{eventId:e.id,clientId:e.clientId,date:e.date,amount:eFeeAmount.value.trim(),status:eFeeStatus.value,method:eFeeMethod.value});if(!linkedFee(e.id))S.finances.unshift(f)})}
function saveEvent(id){let x={id,type:eType.value,title:eTitle.value.trim()||(eType.value==='心理咨询'?'心理咨询':eType.value),clientId:eClient.value,mode:eMode.value,date:normDate(eDate.value),time:eTime.value,timezone:eTz.value,recurrence:eRepeat.value,status:eStatus.value,videoLink:eVideo.value.trim(),notes:eNotes.value};if(!x.date)return alert('请填写日期。');if(x.type==='心理咨询'&&document.getElementById('eFeeCreate')?.checked&&!x.clientId)return alert('建立收费记录前，请先关联来访者。');let conflict=S.events.find(e=>e.id!==id&&e.date===x.date&&e.time&&x.time&&e.time===x.time);if(conflict&&!confirm(`同一时间已有日程「${conflict.title||conflict.type}」。仍要保存吗？`))return;let old=S.events.find(e=>e.id===id),i=S.events.findIndex(e=>e.id===id),saved=x;if(old&&(old.seriesId||S.events.some(z=>z.seriesId===old.id))){let scope=prompt('重复日程：输入 1 仅修改本次；2 修改本次及之后。','1');if(scope==='2'){let sid=old.seriesId||old.id;S.events.forEach(z=>{if((z.id===sid||z.seriesId===sid)&&z.date>=old.date)Object.assign(z,{type:x.type,title:x.title,clientId:x.clientId,mode:x.mode,time:x.time,timezone:x.timezone,notes:x.notes,recurrence:x.recurrence})});S.events[i].date=x.date;saved=S.events[i]}else{S.events[i]={...old,...x};saved=S.events[i]}}else if(i>=0){S.events[i]=x;saved=x}else{S.events.unshift(x);saved=x;if(x.recurrence!=='不重复')createRecurringEvents(x,12)}syncFeeForEvent(saved,id);syncSeriesFees(saved);save();markModalClean();closeModal(true);render();toast('✓ 日程与收费已保存')}
function deleteEventFlow(id){let e=S.events.find(x=>x.id===id);if(!e)return;let sid=e.seriesId||e.id,isSeries=!!(e.seriesId||S.events.some(x=>x.seriesId===e.id)),ids=[];if(!isSeries){if(!confirm('确定删除该日程吗？'))return;ids=[id];S.events=S.events.filter(x=>x.id!==id)}else{let scope=prompt('重复日程：输入 1 仅删除本次；2 删除本次及之后；3 删除整个系列。','1');if(scope==='1'){ids=[id];S.events=S.events.filter(x=>x.id!==id)}else if(scope==='2'){ids=S.events.filter(x=>(x.id===sid||x.seriesId===sid)&&x.date>=e.date).map(x=>x.id);S.events=S.events.filter(x=>!ids.includes(x.id))}else if(scope==='3'){ids=S.events.filter(x=>x.id===sid||x.seriesId===sid).map(x=>x.id);S.events=S.events.filter(x=>!ids.includes(x.id))}else return}let linked=S.finances.filter(f=>ids.includes(f.eventId));if(linked.length&&confirm(`这些日程关联 ${linked.length} 条收费记录。是否同时删除关联的收费记录？\n选择“取消”将保留收费记录。`))S.finances=S.finances.filter(f=>!ids.includes(f.eventId));save();markModalClean();closeModal(true);render();toast('✓ 已保存')}
function createRecurringEvents(base,count){for(let i=1;i<count;i++)S.events.push({...base,id:uid(),date:nextRepeatDate(base.date,base.recurrence,i),seriesId:base.id})}

function linkReferral(cid){if(!S.referrals.length)return alert('请先在「转介网络」中建立资源。');modal(`<h2>添加转介</h2><div class="formgrid"><div class="field full"><label>转介资源</label><select id="lrRef">${S.referrals.map(r=>`<option value="${r.id}">${esc(r.name)} · ${esc(r.type)}</option>`).join('')}</select></div><div class="field"><label>转介日期</label><input id="lrDate" type="date" value="${dateToday()}"></div><div class="field"><label>状态</label><select id="lrStatus"><option>考虑中</option><option>已提供信息</option><option>已联系</option><option>已完成</option></select></div><div class="field full"><label>原因 / 备注</label><textarea id="lrNotes"></textarea></div></div>${foot(`saveReferralLink('${cid}')`,'保存转介')}`)}

function endClientFlow(cid){let c=client(cid),openTasks=S.tasks.filter(x=>x.clientId===cid&&x.status!=='已完成').length,unpaid=S.finances.filter(x=>x.clientId===cid&&isPendingFee(x)).length;modal(`<h2>结束咨询 · ${esc(c.name)}</h2>${openTasks||unpaid?`<div class="notice">提醒：${openTasks?openTasks+' 项任务未完成。 ':''}${unpaid?unpaid+' 笔收费未结。':''}</div>`:''}<div class="formgrid"><div class="field"><label>结束日期</label><input id="endDate" type="date" value="${dateToday()}"></div><div class="field"><label>结束原因</label><input id="endReason"></div><div class="field full"><label>咨询总结</label><textarea id="endSummary"></textarea></div><div class="field full"><label>后续建议</label><textarea id="endNext"></textarea></div><div class="field full"><label>结束时转介（可选）</label><select id="endReferralId"><option value="">不建立转介关联</option>${S.referrals.map(r=>`<option value="${r.id}">${esc(r.name)} · ${esc(r.type)}</option>`).join('')}</select></div></div>${foot(`finishClient('${cid}')`,'结束咨询并归档')}`)}

function renderAssessments(){let rows=[...(S.assessments||[])].filter(a=>!assessmentFilter||a.clientId===assessmentFilter).sort((a,b)=>(b.date||'').localeCompare(a.date||''));document.getElementById('assessments').innerHTML=head('量表评估','使用标准化量表记录症状变化；保存时自动计分并给出严重程度分级。量表结果仅供临床参考，不能替代临床判断。','<button class="btn primary" onclick="openAssessment()">+ 新增评估</button>')+`<div class="card"><div class="row"><select onchange="assessmentFilter=this.value;renderAssessments()"><option value="">全部来访者</option>${S.clients.filter(c=>c.status!=='归档').map(c=>`<option value="${c.id}" ${c.id===assessmentFilter?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>${rows.length?rows.map(a=>{let prev=[...(S.assessments||[])].filter(x=>x.clientId===a.clientId&&x.scale===a.scale&&x.date<a.date).sort((x,y)=>(y.date||'').localeCompare(x.date||''))[0];let delta=prev?a.total-prev.total:null;return `<div class="item"><div><b>${esc(cname(a.clientId))}</b> · ${esc(a.scale)} · ${esc(a.date)}<div class="meta">总分 <b>${a.total}</b>（${esc(a.severity)}）${delta!==null&&delta!==undefined?` · 较上次 ${delta>0?'+':''}${delta}`:''}${a.flag?' · <span style="color:var(--danger)">第 9 题阳性，需关注风险</span>':''}</div></div><div class="row"><button class="btn" onclick="openAssessment('${a.id}')">编辑</button><button class="btn danger" onclick="deleteAssessment('${a.id}')">删除</button></div></div>`}).join(''):'<div class="meta" style="margin-top:10px">暂无评估记录。点击右上角「+ 新增评估」记录 PHQ-9 / GAD-7。</div>'}</div>`}
function openWaitlist(wid=''){let w=(S.waitlist||[]).find(x=>x.id===wid)||{id:uid(),name:'',contact:'',dateAdded:dateToday(),status:'等待中',issues:'',preferred:'',source:'',notes:''};modal(`<h2>候补登记</h2><div class="formgrid"><div class="field"><label>姓名 / 称呼</label><input id="wName" value="${esc(w.name)}"></div><div class="field"><label>联系方式</label><input id="wContact" value="${esc(w.contact)}"></div><div class="field"><label>登记日期</label><input id="wDate" type="date" value="${esc(w.dateAdded)}"></div><div class="field"><label>状态</label><select id="wStatus">${['等待中','已联系','已建档','已关闭'].map(x=>`<option ${x===w.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>咨询议题</label><input id="wIssues" value="${esc(w.issues)}"></div><div class="field"><label>期望时段</label><input id="wPreferred" value="${esc(w.preferred)}" placeholder="例如：工作日晚上"></div><div class="field"><label>来源</label><input id="wSource" value="${esc(w.source)}"></div><div class="field full"><label>备注</label><textarea id="wNotes">${esc(w.notes)}</textarea></div></div>${foot(`saveWaitlist('${w.id}')`,'保存')}`)}
function saveWaitlist(id){if(!wName.value.trim())return alert('请填写姓名 / 称呼。');let x={id,name:wName.value.trim(),contact:wContact.value.trim(),dateAdded:normDate(wDate.value),status:wStatus.value,issues:wIssues.value.trim(),preferred:wPreferred.value.trim(),source:wSource.value.trim(),notes:wNotes.value.trim()};S.waitlist=S.waitlist||[];let old=S.waitlist.find(w=>w.id===id);if(old)x.clientId=old.clientId;let i=S.waitlist.findIndex(w=>w.id===id);if(i>=0)S.waitlist[i]=x;else S.waitlist.push(x);save();markModalClean();closeModal(true);render();toast('✓ 候补登记已保存')}
function deleteWaitlist(wid){if(!confirm('确定删除这条候补登记？'))return;S.waitlist=S.waitlist.filter(w=>w.id!==wid);save();render();toast('已删除')}
function convertToClient(wid){let w=(S.waitlist||[]).find(x=>x.id===wid);if(!w)return;if(w.clientId){openClient(w.clientId);return}let c={id:uid(),name:w.name,dob:'',gender:'',phone:w.contact,firstDate:dateToday(),issues:w.issues||'',status:'进行中',notes:'来自候补名单'+(w.notes?'：'+w.notes:''),checklist:{consent:false,payment:false,contact:false,emergency:false,privacy:false,sensitive:false,risk:false},customChecklist:[],documents:[],defaultFee:''};S.clients.unshift(c);w.status='已建档';w.clientId=c.id;save();render();toast('✓ 已转为正式来访者档案');openClient(c.id)}
function renderWaitlist(){let groups=['等待中','已联系','已建档','已关闭'];document.getElementById('waitlist').innerHTML=head('候补名单','登记正在等待空缺的潜在来访者；有空缺时按登记顺序联系，可一键转为正式来访者档案。','<button class="btn primary" onclick="openWaitlist()">+ 新增候补</button>')+groups.map(st=>{let rows=(S.waitlist||[]).filter(w=>w.status===st).sort((a,b)=>(a.dateAdded||'').localeCompare(b.dateAdded||''));return `<div class="card" style="margin-bottom:12px"><h3 class="section-title">${st}（${rows.length}）</h3>${rows.length?rows.map(w=>`<div class="item"><div><b>${esc(w.name)}</b><div class="meta">${esc(w.contact||'')} ${w.issues?'· '+esc(w.issues):''} ${w.preferred?'· 期望：'+esc(w.preferred):''} · 登记于 ${esc(w.dateAdded||'')}</div></div><div class="row"><button class="btn" onclick="openWaitlist('${w.id}')">编辑</button>${st!=='已建档'?`<button class="btn" onclick="convertToClient('${w.id}')">转为来访者</button>`:`<button class="btn" onclick="openClient('${w.clientId}')">查看档案</button>`}<button class="btn danger" onclick="deleteWaitlist('${w.id}')">删除</button></div></div>`).join(''):'<div class="meta">暂无</div>'}</div>`}).join('')}
let insRangeVal='month';
function inRangeW(d,r){if(!d)return false;let now=new Date(),y=now.getFullYear(),m=now.getMonth();let ms=new Date(y,m,1),ls=new Date(y,m-1,1),qs=new Date(y,m-2,1),dt=new Date(d+'T00:00:00');if(r==='month')return dt>=ms;if(r==='last')return dt>=ls&&dt<ms;if(r==='quarter')return dt>=qs;return true}
function renderInsights(){let r=insRangeVal;let evs=S.events.filter(e=>inRangeW(e.date,r)),consults=evs.filter(e=>e.type==='心理咨询');let cnt=st=>consults.filter(e=>(e.status||'已确认')===st).length;let fins=S.finances.filter(f=>inRangeW(f.date,r));let received=fins.filter(f=>f.status==='已收').reduce((s,f)=>s+(parseFloat(f.amount)||0),0);let pending=fins.filter(f=>isPendingFee(f)).reduce((s,f)=>s+(parseFloat(f.amount)||0),0);let sess=S.sessions.filter(s=>inRangeW(s.date,r)).length;let byClient={};S.sessions.filter(s=>inRangeW(s.date,r)).forEach(s=>{byClient[s.clientId]=(byClient[s.clientId]||0)+1});let top=Object.entries(byClient).sort((a,b)=>b[1]-a[1]).slice(0,8);let months=[];for(let i=5;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i);let key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');let amt=S.finances.filter(f=>(f.date||'').startsWith(key)&&f.status==='已收').reduce((s,f)=>s+(parseFloat(f.amount)||0),0);months.push([key,amt])}let maxM=Math.max(1,...months.map(x=>x[1]));document.getElementById('insights').innerHTML=head('数据洞察','执业运营概览：咨询量、出勤情况与收入统计，全部由本机数据即时计算。',`<select onchange="insRangeVal=this.value;renderInsights()">${[['month','本月'],['last','上月'],['quarter','近三个月'],['all','全部']].map(([v,n])=>`<option value="${v}" ${v===r?'selected':''}>${n}</option>`).join('')}</select>`)+`<div class="grid g4"><div class="card"><div class="meta">咨询场次（记录）</div><div class="metric">${sess}</div></div><div class="card"><div class="meta">已实收</div><div class="metric">¥${received.toFixed(2)}</div></div><div class="card"><div class="meta">待收金额</div><div class="metric">¥${pending.toFixed(2)}</div></div><div class="card"><div class="meta">爽约 / 迟到取消</div><div class="metric">${cnt('爽约')+cnt('迟到取消')}</div></div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h3 class="section-title">出勤情况（咨询日程 ${consults.length} 场）</h3><p>已完成 ${cnt('已完成')} · 已确认（待进行）${cnt('已确认')} · 爽约 ${cnt('爽约')} · 迟到取消 ${cnt('迟到取消')} · 已取消 ${cnt('已取消')}</p><h3 class="section-title">咨询量 Top 来访者</h3>${top.length?top.map(([cid,n])=>`<p style="margin:6px 0">${esc(cname(cid))} · ${n} 次</p>`).join(''):'<div class="meta">暂无记录</div>'}</div><div class="card"><h3 class="section-title">近 6 个月实收</h3>${months.map(([k,v])=>`<div class="row" style="align-items:center;margin:6px 0"><span style="width:70px" class="meta">${k}</span><div style="flex:1;height:10px;background:var(--soft);border-radius:99px"><div style="height:100%;width:${Math.round(v/maxM*100)}%;background:var(--accent);border-radius:99px"></div></div><b>¥${v.toFixed(0)}</b></div>`).join('')}</div></div>`}
let stmtSel={clientId:'',start:'',end:''};
function renderStatement(){let now=new Date();if(!stmtSel.start)stmtSel.start=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-01';if(!stmtSel.end)stmtSel.end=dateToday();let cid=stmtSel.clientId||(S.clients[0]&&S.clients[0].id)||'';let fins=S.finances.filter(f=>f.clientId===cid&&f.date>=stmtSel.start&&f.date<=stmtSel.end).sort((a,b)=>a.date.localeCompare(b.date));let sess=S.sessions.filter(x=>x.clientId===cid&&x.date>=stmtSel.start&&x.date<=stmtSel.end).sort((a,b)=>a.date.localeCompare(b.date));let amt=fins.reduce((s,f)=>s+(parseFloat(f.amount)||0),0),rec=fins.filter(f=>f.status==='已收').reduce((s,f)=>s+(parseFloat(f.amount)||0),0);document.getElementById('statement').innerHTML=head('收费对账单','按来访者与时间段生成对账单，可打印或保存为 PDF 交来访者核对。','<button class="btn" onclick="go(\'finance\')">返回收费</button>')+`<div class="card no-print"><div class="row"><select onchange="stmtSel.clientId=this.value;renderStatement()">${S.clients.filter(c=>c.status!=='归档').map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.name)}</option>`).join('')}</select><input type="date" value="${stmtSel.start}" onchange="stmtSel.start=this.value;renderStatement()"><input type="date" value="${stmtSel.end}" onchange="stmtSel.end=this.value;renderStatement()"><button class="btn primary" onclick="window.print()">打印 / PDF</button></div></div><div class="card" style="margin-top:12px"><h3 class="section-title">收费对账单</h3><p class="meta">${esc(S.settings.practiceName||'')} ${S.settings.ownerName?'· 咨询师：'+esc(S.settings.ownerName):''}</p><p>来访者：<b>${esc(cid?cname(cid):'')}</b> · 期间：${esc(stmtSel.start)} 至 ${esc(stmtSel.end)}</p><h4>咨询记录（${sess.length} 次）</h4>${sess.length?sess.map(x=>`<p style="margin:4px 0">${esc(x.date)} · 心理咨询</p>`).join(''):'<p class="meta">期间内无咨询记录</p>'}<h4>收费明细</h4>${fins.length?fins.map(f=>`<p style="margin:4px 0">${esc(f.date)} · 应收 ¥${esc(f.amount||'0')} · ${esc(f.status||'')}</p>`).join(''):'<p class="meta">期间内无收费记录</p>'}<p><b>应收合计 ¥${amt.toFixed(2)} · 已收合计 ¥${rec.toFixed(2)} · 未收 ¥${(amt-rec).toFixed(2)}</b></p><p class="meta">本对账单由咨询师工作台依据本地记录生成，仅供双方核对。</p></div>`}
function addDocument(cid){let name=docName.value.trim();if(!name)return alert('请填写文档名称。');let c=client(cid);c.documents=c.documents||[];c.documents.push({id:uid(),name,date:docDate.value||dateToday(),status:docStatus.value});save();openClient(cid);toast('✓ 文档记录已添加')}

function renderPrivacy(){let s=S.settings||{};document.getElementById('privacy').innerHTML=head('隐私与合规','依据《个人信息保护法》《数据安全法》《精神卫生法》整理的数据处理说明与实用模板。本页为产品功能说明与一般信息，不构成法律意见。')+`<div class="card"><h3 class="section-title">本工作台（网页版）如何处理个人信息</h3><p>· <b>本地保存、不上传：</b>数据只保存在你当前浏览器的本地存储中，不上传任何服务器，不做数据分析或广告。</p><p>· <b>敏感个人信息：</b>心理健康信息属于《个人信息保护法》第二十八条规定的敏感个人信息，处理前应取得来访者的<b>单独同意</b>（建档清单已内置该确认项）；处理不满 14 周岁未成年人的个人信息，还应取得其监护人同意。</p><p>· <b>安全措施：</b>网页版提供访问密码锁定与无操作自动锁定；但浏览器本地存储本身<b>不做静态加密</b>，请只在个人设备上使用，并为设备设置系统密码。需要数据库级加密时，请使用桌面版（加密数据库 + 审计日志）。</p><p>· <b>来访者权利：</b>来访者有权查阅、复制、更正其个人信息，并在法定情形下请求删除。来访者档案提供「导出档案」与「彻底删除」以便响应这些请求；删除前请确认专业伦理与相关规范对记录保存期限的要求。</p><p>· <b>影响评估与事件处置：</b>处理敏感个人信息应事前进行个人信息保护影响评估并留存记录；如发生或可能发生数据泄露，应立即采取补救措施，并依法通知主管部门与受影响的来访者。</p><p>· <b>请勿做的事：</b>不要把导出的备份/档案文件存入云盘、网盘或境外服务器；不要在公共或共享设备上使用网页版。</p><p>· <b>保密义务：</b>依《精神卫生法》，心理咨询人员应尊重来访者隐私、为其个人信息保密。</p></div><div class="card"><div class="row" style="justify-content:space-between"><h3 class="section-title">《个人信息处理告知》模板（可打印交来访者签署）</h3><button class="btn" onclick="window.print()">打印 / 导出 PDF</button></div><div style="line-height:2"><p><b>${esc(s.practiceName||'（机构 / 工作室名称）')}</b>（咨询师：${esc(s.ownerName||'（姓名）')}，以下简称"处理者"）在为你提供心理咨询服务的过程中，将处理你的以下个人信息：姓名 / 称呼、出生年月日、联系方式、咨询诉求与背景信息、每次咨询的记录、收费记录，以及紧急联系人信息。其中，心理健康相关信息属于<b>敏感个人信息</b>。</p><p><b>处理目的与方式：</b>仅用于建立咨询档案、安排与开展咨询、记录咨询过程、收费结算与依法履行专业义务。处理方式为在咨询师本人设备的浏览器本地存储中保存与查阅，<b>不向任何第三方提供，不上传云端，不用于营销或其他目的</b>。</p><p><b>保存期限：</b>咨询关系存续期间及结束后依专业伦理与相关规范要求的期限保存；超期或应你的合法请求予以删除。</p><p><b>你的权利：</b>你有权查阅、复制、更正你的个人信息，有权撤回同意（撤回不影响撤回前已进行处理的效力），并可在法定情形下请求删除。</p><p><b>安全保护：</b>处理者采取访问密码锁定、自动锁定与定期备份等措施保护你的信息。如发生信息安全事件，处理者将依法及时告知你。</p><p>本人已阅读并理解上述内容，同意处理者按上述目的与方式处理本人的个人信息（包括敏感个人信息）。如本人不满 14 周岁，本告知须由监护人签署。</p><p style="margin-top:26px">来访者（或监护人）签名：＿＿＿＿＿＿＿＿　　日期：＿＿＿＿年＿＿月＿＿日</p></div></div>`}

function deleteClientForever(cid){let c=client(cid);if(!c)return;let nm=S.settings.privacy?cname(cid):c.name;let counts={咨询记录:S.sessions.filter(x=>x.clientId===cid).length,日程:S.events.filter(x=>x.clientId===cid).length,目标:S.goals.filter(x=>x.clientId===cid).length,任务:S.tasks.filter(x=>x.clientId===cid).length,随手记:S.quickNotes.filter(x=>x.clientId===cid).length,收费:S.finances.filter(x=>x.clientId===cid).length,转介:S.referralLinks.filter(x=>x.clientId===cid).length};let summary=Object.entries(counts).map(([k,v])=>k+' '+v+' 条').join('、');if(!confirm('将彻底删除来访者「'+nm+'」及其全部关联数据（'+summary+'）。此操作不可撤销。\n\n如该请求来自来访者本人，请确认你已核实其身份，且专业伦理与相关规范不要求继续保存这些记录。'))return;if(!confirm('再次确认：彻底删除「'+nm+'」的全部数据？'))return;S.clients=S.clients.filter(x=>x.id!==cid);S.sessions=S.sessions.filter(x=>x.clientId!==cid);S.events=S.events.filter(x=>x.clientId!==cid);S.tasks=S.tasks.filter(x=>x.clientId!==cid);S.finances=S.finances.filter(x=>x.clientId!==cid);S.goals=S.goals.filter(x=>x.clientId!==cid);S.quickNotes=S.quickNotes.filter(x=>x.clientId!==cid);S.referralLinks=S.referralLinks.filter(x=>x.clientId!==cid);S.recentViews=S.recentViews.filter(x=>x.clientId!==cid);S.assessments=(S.assessments||[]).filter(x=>x.clientId!==cid);S.waitlist=(S.waitlist||[]).filter(x=>x.clientId!==cid);delete S.plans[cid];save();closeModal(true);go('clients');toast('已彻底删除该来访者及其关联数据')}
function renderData(){let has=S.clients.length+S.sessions.length+S.events.length+S.tasks.length+S.finances.length+S.quickNotes.length+S.referrals.length;document.getElementById('data').innerHTML=head('数据中心','数据仅保存在当前浏览器。清除浏览器数据、重置浏览器或设备故障可能造成数据丢失。导出的备份与档案文件为明文，请勿存入云盘、网盘或境外服务器，并请保存在安全位置、使用后及时删除。')+`<div class="grid g2"><div class="card"><h3 class="section-title">完整备份</h3><button class="btn primary" onclick="backup()">导出完整备份</button><div class="meta">${S.backupMeta.lastBackup?'上次备份：'+new Date(S.backupMeta.lastBackup).toLocaleString('zh-CN'):(has?'尚未记录完整备份':'目前没有工作数据')}</div></div><div class="card"><h3 class="section-title">恢复备份</h3><input type="file" id="restoreFile" accept=".json"><button class="btn" onclick="restore()">恢复备份</button></div></div><div class="card" style="margin-top:12px"><h3>数据健康检查</h3><button class="btn" onclick="showDataHealth()">检查待处理项目</button></div><div class="card" style="margin-top:12px"><h3>分类导出</h3><div class="row"><button class="btn" onclick="exportClientsCSV()">来访者名单 CSV</button><button class="btn" onclick="exportFinanceCSV()">收费记录 CSV</button><button class="btn" onclick="exportTasksCSV()">任务 CSV</button><button class="btn" onclick="exportReferrals()">转介网络 CSV</button></div><div class="meta">单个来访者档案可从来访者详情页导出。</div></div>${hasDemoData()?`<div class="card" style="margin-top:16px;border-style:dashed"><h3>演示数据</h3><div class="meta">演示资料均为虚构。清除演示数据不会影响您自己录入的资料。</div><button class="btn danger" style="margin-top:10px" onclick="clearDemoData()">一键清除演示数据</button></div>`:`<div class="card" style="margin-top:16px"><h3>演示数据</h3><div class="meta">可载入一套虚构示例，体验来访者、咨询记录、日程、任务和收费之间的工作流。</div><button class="btn" style="margin-top:10px" onclick="loadDemoData()">载入演示数据</button></div>`}<div class="card" style="margin-top:16px"><h3>清除本地数据</h3><button class="btn danger" onclick="clearData()">清除工作数据</button></div>`}
function backup(){S.backupMeta.lastBackup=Date.now();save();let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`心理咨询师工作台备份_${dateToday()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);render()}
function restore(){let f=restoreFile.files[0];if(!f)return alert('请选择备份文件。');if(!confirm('恢复将覆盖当前工作台数据，确认继续？'))return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.clients))throw 0;S=Object.assign(emptyState(),x);normalizeV17();save();applySettings();alert('恢复完成。');go('today')}catch{alert('备份文件无法识别。')}};r.readAsText(f)}
function clearData(){if(confirm('确认清除全部工作数据？此操作无法撤销。')){let settings=S.settings;S=emptyState();S.settings=settings;save();go('today')}}
function renderSettings(){document.getElementById('settings').innerHTML=head('个性化设置','调整工作台名称、主题色、显示模式和自动锁定。')+`<div class="card"><div class="formgrid"><div class="field"><label>咨询师姓名</label><input id="setOwner" value="${esc(S.settings.ownerName||'')}"></div><div class="field"><label>工具名称</label><input id="setToolName" value="${esc(S.settings.toolName||'心理咨询师工作台')}"></div><div class="field"><label>机构 / 工作室名称</label><input id="setPractice" value="${esc(S.settings.practiceName||'')}"></div><div class="field full"><label>工作台图标</label><div class="icon-choices">${['✦','✧','★','☆','✶','✷','✹','✺','♥','♡','❥','❦','●','○','◆','◇','◈','☀','☾','☁','❋','❖'].map(x=>`<button type="button" class="icon-choice ${((S.settings.workstationIcon||S.settings.mobileIcon||'✦')===x)?'selected':''}" data-icon="${x}" onclick="pickWorkstationIcon(this)">${x}</button>`).join('')}</div><input type="hidden" id="setWorkstationIcon" value="${esc(S.settings.workstationIcon||S.settings.mobileIcon||'✦')}"><div class="meta" style="margin-top:6px">选择顶部左侧显示的工作台图标。</div></div><div class="field full"><label>主题色</label><div class="theme-swatches" id="themeSwatches">
${[['#4a778b','门户蓝灰（默认）'],['#365f8d','沉静蓝'],['#526b5c','鼠尾草绿'],['#735b7d','灰紫'],['#8a5d4d','陶土棕'],['#3f5d68','石板蓝']].map(([v,n])=>`<button type="button" class="theme-swatch ${S.settings.accent===v?'selected':''}" style="--sw:${v}" data-color="${v}" onclick="pickTheme(this)"><span></span>${n}</button>`).join('')}
</div><div class="row" style="margin-top:8px"><label style="font-weight:500">自定义</label><input id="setAccent" type="color" value="${esc(S.settings.accent||'#4a778b')}" style="width:52px;height:38px;padding:3px"></div></div><div class="field"><label>字号</label><select id="setFontSize">${[['small','小'],['normal','标准'],['large','大']].map(([v,n])=>`<option value="${v}" ${(S.settings.fontSize||'normal')===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>界面密度</label><select id="setDensity">${[['comfortable','舒适（间距较大）'],['compact','紧凑（同屏显示更多）']].map(([v,n])=>`<option value="${v}" ${(S.settings.density||'comfortable')===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>标题栏风格</label><select id="setHeaderStyle">${[['aurora','极光渐变（品牌默认）'],['solid','纯色深青'],['light','浅色简洁']].map(([v,n])=>`<option value="${v}" ${(S.settings.headerStyle||'aurora')===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>打开时默认页面</label><select id="setHomePage">${[['today','今日工作台'],['calendar','日程'],['clients','来访者'],['tasks','任务看板']].map(([v,n])=>`<option value="${v}" ${(S.settings.homePage||'today')===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field full"><label>首页显示模块</label><div class="row" style="flex-wrap:wrap;gap:10px">${[['consults','今日咨询'],['missing','待补咨询记录'],['tasks','待办任务'],['fees','待收费'],['checklist','建档未完成']].map(([k,n])=>`<label style="font-weight:500"><input type="checkbox" class="hm-input" data-module="${k}" style="width:auto" ${(!S.settings.homeModules||S.settings.homeModules[k]!==false)?'checked':''}> ${n}</label>`).join('')}</div></div><div class="field full"><button class="btn" type="button" onclick="resetAppearance()">恢复默认外观</button><span class="meta">恢复品牌主题色、标准字号、舒适密度与极光标题栏；不影响账户与机构设置。</span></div><div class="field"><label>隐私模式</label><label style="font-weight:500"><input id="setPrivacy" type="checkbox" style="width:auto" ${S.settings.privacy?'checked':''}> 临时隐藏来访者姓名</label></div><div class="field"><label>闲置自动锁定</label><select id="setLock">${[['0','不自动锁定'],['5','5 分钟'],['10','10 分钟'],['15','15 分钟'],['30','30 分钟'],['60','60 分钟']].map(([v,n])=>`<option value="${v}" ${String(S.settings.autoLock)===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>默认时区</label><select id="setTz"><option value="Asia/Shanghai">北京时间（UTC+8）</option></select></div></div><div class="row" style="margin-top:12px"><button class="btn primary" onclick="saveSettings()">保存设置</button><button class="btn" onclick="reopenOnboarding()">重新打开首次使用引导</button></div></div>`}
function pickTheme(b){document.querySelectorAll('.theme-swatch').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');setAccent.value=b.dataset.color;document.documentElement.style.setProperty('--accent',b.dataset.color)}
function pickWorkstationIcon(b){document.querySelectorAll('.icon-choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');setWorkstationIcon.value=b.dataset.icon;document.querySelector('.brand').textContent=b.dataset.icon}
function resetAppearance(){S.settings.accent='#4a778b';S.settings.dark=false;S.settings.fontSize='normal';S.settings.density='comfortable';S.settings.headerStyle='aurora';S.settings.homePage='today';save();applySettings();renderSettings();toast('已恢复默认外观')}
function saveSettings(){S.settings.ownerName=setOwner.value.trim();S.settings.toolName=setToolName.value.trim()||'心理咨询师工作台';S.settings.practiceName=setPractice.value.trim();S.settings.workstationIcon=setWorkstationIcon.value;S.settings.accent=setAccent.value;S.settings.autoLock=Number(setLock.value);S.settings.timezone=setTz.value;S.settings.privacy=!!setPrivacy.checked;S.settings.fontSize=setFontSize.value;S.settings.density=setDensity.value;S.settings.headerStyle=setHeaderStyle.value;S.settings.homePage=setHomePage.value;S.settings.homeModules=Object.fromEntries([...document.querySelectorAll('.hm-input')].map(x=>[x.dataset.module,x.checked]));save();applySettings();resetIdle();toast('✓ 设置已保存')}
function applyAppearance(){let s=S.settings||{};document.body.style.zoom=s.fontSize==='small'?'0.92':s.fontSize==='large'?'1.08':'';document.body.classList.toggle('compact',s.density==='compact');document.body.classList.remove('hdr-aurora','hdr-solid','hdr-light');document.body.classList.add('hdr-'+(s.headerStyle||'aurora'));applyHomeModules()}
function applyHomeModules(){let mods=(S.settings&&S.settings.homeModules)||{};document.querySelectorAll('#today [data-module]').forEach(el=>{el.style.display=mods[el.dataset.module]===false?'none':''})}
function applySettings(){applyAppearance();document.documentElement.style.setProperty('--accent',S.settings.accent||'#4a778b');document.body.classList.toggle('dark',!!S.settings.dark);document.querySelector('.brand').textContent=S.settings.workstationIcon||S.settings.mobileIcon||'✦';document.body.classList.toggle('privacy-on',!!S.settings.privacy);let pb=document.getElementById('privacyBtn');if(pb)pb.textContent=S.settings.privacy?'◎':'◉'}
function toggleDark(){S.settings.dark=!S.settings.dark;save();applySettings()}
let modalDirty=false;
function modal(content){modalDirty=false;document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`;let m=document.querySelector('#modalRoot .modal');if(m){m.addEventListener('input',()=>modalDirty=true);m.addEventListener('change',()=>modalDirty=true);setTimeout(()=>{let f=m.querySelector('input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea:not([disabled]),[contenteditable=true]');if(f&&!f.closest('.toolbar'))f.focus({preventScroll:true})},30)}}
function markModalClean(){modalDirty=false}
function closeModal(force=false){if(!force&&modalDirty&&!confirm('当前窗口有尚未保存的修改。确定放弃吗？'))return false;document.getElementById('modalRoot').innerHTML='';modalDirty=false;return true}
function foot(action,label){return `<div class="modalfoot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="${action}">${label}</button></div>`}
function toast(msg,undo){let box=document.getElementById('toastbox');if(!box)return;let d=document.createElement('div');d.className='toast';d.innerHTML=esc(msg)+(undo?`<button>撤销</button>`:'');if(undo)d.querySelector('button').onclick=()=>{undo();d.remove()};box.appendChild(d);setTimeout(()=>d.remove(),3200)}
function toggleQuickMenu(){document.getElementById('quickMenu').classList.toggle('hidden')}
function quickAdd(k){document.getElementById('quickMenu').classList.add('hidden');({session:()=>editSession(),event:()=>editEvent(),task:()=>editTask(),note:()=>editNote(),client:()=>editClient(),finance:()=>editFinance()}[k]||(()=>{}))()}
function toggleMobileMore(){document.querySelector('.nav')?.style.setProperty('display','flex');setTimeout(()=>{document.querySelector('.nav')?.style.removeProperty('display')},6000)}
function togglePrivacy(){S.settings.privacy=!S.settings.privacy;save();applySettings();render();toast(S.settings.privacy?'隐私模式已开启':'隐私模式已关闭')}
function openGlobalSearch(){go('search');setTimeout(()=>document.getElementById('globalQ')?.focus(),0)}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openGlobalSearch();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&document.getElementById('modalRoot').innerHTML){e.preventDefault();let b=document.querySelector('#modalRoot .modalfoot .btn.primary');if(b&&!b.disabled)b.click();return}if(e.key==='Escape'&&document.getElementById('modalRoot').innerHTML)closeModal()})
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function auth(){try{return JSON.parse(localStorage.getItem(AUTH)||'null')}catch{return null}}
function initAuth(){let a=auth(),lockEl=document.getElementById('lock');lockEl.classList.remove('hidden');if(!a){lockTitle.textContent='首次使用';lockSub.textContent='创建启动密码。';setupName.classList.remove('hidden');confirmWrap.classList.remove('hidden')}else{lockTitle.textContent='心理咨询师工作台';lockSub.textContent='输入启动密码进入工作台。'}lockPassword.focus()}
function unlock(){let a=auth(),p=lockPassword.value;if(!a){if(p.length<6)return lockError.textContent='启动密码至少 6 位。';if(p!==lockConfirm.value)return lockError.textContent='两次输入的密码不一致。';let salt=uid();localStorage.setItem(AUTH,JSON.stringify({salt,hash:hash(salt+p)}));S.settings.ownerName=ownerName.value.trim();save();document.getElementById('lock').classList.add('hidden')}else if(hash(a.salt+p)===a.hash){document.getElementById('lock').classList.add('hidden');lockPassword.value='';lockError.textContent=''}else return lockError.textContent='密码不正确。';resetIdle()}
function lockNow(){closeModal();setupName.classList.add('hidden');confirmWrap.classList.add('hidden');lockTitle.textContent='心理咨询师工作台';lockSub.textContent='输入启动密码进入工作台。';lockError.textContent='';document.getElementById('lock').classList.remove('hidden');lockPassword.value='';lockConfirm.value='';lockPassword.focus()}
function togglePw(id,b){let x=document.getElementById(id);x.type=x.type==='password'?'text':'password';b.textContent=x.type==='password'?'◉':'◎'}
function resetIdle(){clearTimeout(idleTimer);let m=Number(S.settings.autoLock||0);if(m>0&&document.getElementById('lock').classList.contains('hidden'))idleTimer=setTimeout(lockNow,m*60000)}
['mousemove','keydown','click','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(document.getElementById('lock').classList.contains('hidden'))resetIdle()},{passive:true}))
lockPassword?.addEventListener('keyup',e=>{caps.classList.toggle('hidden',!e.getModifierState('CapsLock'));if(e.key==='Enter')unlock()});
function bootstrap(){
 try{
  normalizeV17();
  applySettings();
  go(S.settings.homePage||'today');
  initAuth();
 }catch(err){
  console.error('工作台启动失败',err);
  const sec=document.getElementById('today');
  if(sec){sec.classList.add('active');sec.innerHTML='<div class="pagehead"><div><h1>今日工作台</h1><div class="sub">工作台启动时遇到错误。</div></div></div><div class="card"><b>无法正常载入页面</b><div class="sub" style="margin-top:8px">请保留此 HTML 文件，并打开浏览器开发者工具查看错误信息。工作台不会自动清除本地数据。</div><pre style="white-space:pre-wrap;margin-top:12px">'+esc(err&&err.message?err.message:String(err))+'</pre></div>'}
 }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootstrap);else bootstrap();
</script>

 const arrays=['clients','sessions','sessionDrafts','events','tasks','goals','quickNotes','noteDrafts','templates','finances','recentViews','referrals','referralLinks','snippets'];
 arrays.forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
 if(!S.plans||typeof S.plans!=='object')S.plans={};
 if(!S.settings||typeof S.settings!=='object')S.settings={};
 if(!S.backupMeta||typeof S.backupMeta!=='object')S.backupMeta={};
 S.clients.forEach(c=>{if(!c.checklist||typeof c.checklist!=='object')c.checklist={};if(!Array.isArray(c.customChecklist))c.customChecklist=[]});
 S.sessions.forEach(x=>{x.recordStatus=x.recordStatus||'已完成';x.locked=!!x.locked});
 S.events.forEach(x=>{x.recurrence=x.recurrence||'不重复'});

function isPendingFee(f){return !!f&&!['已收','免收费','取消'].includes(f.status||'待收费')}
function eventHasOccurred(e){if(!e||!e.date)return false;let t=dateToday();if(e.date<t)return true;if(e.date>t)return false;if(!e.time)return true;let now=new Date(),hm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');return e.time<=hm}
function getMissingConsultEvents(){let events=S.events.filter(e=>e&&e.type==='心理咨询'&&e.clientId&&eventHasOccurred(e)).sort((a,b)=>(a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||'')));let used=new Set();return events.filter(e=>{let exact=S.sessions.find(s=>s&&s.eventId===e.id&&s.recordStatus!=='草稿');if(exact){used.add(exact.id);return false}let legacy=S.sessions.find(s=>s&&!used.has(s.id)&&!s.eventId&&s.clientId===e.clientId&&s.date===e.date&&s.recordStatus!=='草稿');if(legacy){used.add(legacy.id);return false}return true})}

function editSession(id='',eventId='',clientId='',forceEdit=false){let s=id?S.sessions.find(x=>x.id===id):null,e=eventId?S.events.find(x=>x.id===eventId):null,d=!id?S.sessionDrafts.find(x=>(eventId&&x.eventId===eventId)||(!eventId&&clientId&&x.clientId===clientId)):null;let x=s||d||{id:uid(),clientId:clientId||e?.clientId||'',eventId:eventId||'',date:e?.date||dateToday(),mode:e?.mode||'视频',duration:'50',content:'',recordStatus:'草稿'},locked=!!(s&&(s.locked||s.recordStatus==='已锁定')&&!forceEdit);modal(`${locked?'<div class="notice">此记录已锁定，当前为只读。点击「重新编辑」后才能修改。</div>':''}<h2>${id?'咨询记录':'新建咨询记录'}</h2><div class="formgrid"><div class="field"><label>来访者</label><select id="sClient" onchange="sessionDraft()">${opts(x.clientId,false)}</select></div><div class="field"><label>咨询日期</label><input id="sDate" type="date" value="${esc(x.date||'')}" oninput="sessionDraft()"></div><div class="field"><label>咨询形式</label><select id="sMode" onchange="sessionDraft()">${['视频','面询','电话','其他'].map(v=>`<option ${x.mode===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>咨询时长（分钟）</label><input id="sDuration" value="${esc(x.duration||'')}" oninput="sessionDraft()"></div><div class="field"><label>记录状态</label><select id="sRecordStatus" onchange="sessionDraft()">${['草稿','已完成','已锁定'].map(v=>`<option ${x.recordStatus===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><div class="row" style="justify-content:space-between"><label>咨询笔记</label><div class="row"><select id="templatePick"><option value="">自由书写（默认）</option><optgroup label="内置参考模板">${BUILTIN_TEMPLATES.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</optgroup>${S.templates.length?`<optgroup label="我的模板">${S.templates.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</optgroup>`:''}</select><button class="btn" onclick="applyTemplate()">套用</button><button class="btn" onclick="copyPrevious()">从前次咨询记录复制</button><button class="btn" onclick="toggleSnippetPanel()">插入常用文字</button></div></div><div id="snippetPanel" class="card" style="display:none;margin:10px 0;padding:12px"><div class="row" style="justify-content:space-between"><b>常用记录用语</b><span class="meta">仅在符合实际咨询与评估情况时使用</span></div><div class="formgrid" style="margin-top:10px"><div class="field"><label>类别</label><select id="snippetCat" onchange="renderSnippetChoices()">${BUILTIN_SNIPPETS.map(x=>`<option>${esc(x.cat)}</option>`).join('')}<option>我的常用文字</option></select></div><div class="field"><label>选择文字</label><select id="snippetChoice"></select></div></div><div class="row" style="margin-top:10px"><button class="btn primary" onclick="insertSelectedSnippet()">插入到记录</button><button class="btn" onclick="document.getElementById('snippetPanel').style.display='none'">收起</button></div></div><div class="toolbar"><button onclick="fmt('bold')"><b>B</b></button><button onclick="fmt('italic')"><i>I</i></button><button onclick="fmt('underline')"><u>U</u></button><button onclick="fmt('insertUnorderedList')">• 列表</button><button onclick="fmt('insertOrderedList')">1. 列表</button><button onclick="fmt('formatBlock','h3')">标题</button><button onclick="fmt('formatBlock','blockquote')">引用</button><button onclick="fmt('undo')">↶</button><button onclick="fmt('redo')">↷</button></div><div id="sessionEditor" class="editor" contenteditable="${locked?'false':'true'}" ${locked?'':'oninput="sessionDraft()"'}>${x.content||''}</div><div class="save-status" id="sessionStatus">${d?'已恢复未完成草稿':''}</div></div></div><div class="modalfoot"><button class="btn" onclick="printCurrentSession()">打印 / 保存为 PDF</button><button class="btn" onclick="closeModal()">取消</button>${locked?`<button class="btn primary" onclick="editSession('${x.id}','','',true)">重新编辑</button>`:`<button class="btn" onclick="saveSessionDraftRecord('${x.id}','${id||''}')">保存为草稿</button><button class="btn primary" onclick="completeSession('${x.id}','${id||''}')">保存记录</button>`}</div>`);window._sessionEvent=x.eventId||''}

function printCurrentSession(){let w=window.open('','_blank','width=900,height=700');let name=cname(sClient.value),date=normDate(sDate.value),mode=sMode.value,dur=sDuration.value,tool=esc(S.settings.toolName||'心理咨询师工作台'),org=esc(S.settings.practiceName||'');w.document.write(`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>咨询记录 - ${esc(name)} - ${esc(date)}</title><style>@page{margin:18mm 18mm 22mm}body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;max-width:820px;margin:40px auto;color:#222;line-height:1.7}h1{font-size:22px}.tool{font-size:12px;color:#777;margin-bottom:4px}.meta{color:#666;border-bottom:1px solid #ddd;padding-bottom:14px;margin-bottom:22px}.footer{position:fixed;bottom:4mm;left:18mm;right:18mm;text-align:center;font-size:10px;color:#888;border-top:1px solid #eee;padding-top:5px}@media print{body{margin:0;max-width:none}}</style></head><body><div class="tool">${tool}</div><h1>咨询记录</h1><div class="meta">来访者：${esc(name)}　日期：${esc(date)}　形式：${esc(mode)}${dur?'　时长：'+esc(dur)+' 分钟':''}</div><div>${sessionEditor.innerHTML}</div>${org?`<div class="footer">${org}</div>`:''}<script>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()}
function sessionDraft(){clearTimeout(autosaveTimer);let st=document.getElementById('sessionStatus');if(st)st.textContent='正在保存草稿…';autosaveTimer=setTimeout(()=>{let x={id:'draft-'+(window._sessionEvent||sClient.value),eventId:window._sessionEvent||'',clientId:sClient.value,date:normDate(sDate.value),mode:sMode.value,duration:sDuration.value,content:sessionEditor.innerHTML,recordStatus:(document.getElementById('sRecordStatus')?.value||'草稿'),updatedAt:Date.now()};S.sessionDrafts=S.sessionDrafts.filter(d=>d.id!==x.id);S.sessionDrafts.unshift(x);save();if(st)st.textContent='已自动保存 · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})},900)}
function saveSessionDraftRecord(newId,existingId){let x={id:'draft-'+(window._sessionEvent||sClient.value),eventId:window._sessionEvent||'',clientId:sClient.value,date:normDate(sDate.value),mode:sMode.value,duration:sDuration.value,content:sessionEditor.innerHTML,recordStatus:'草稿',updatedAt:Date.now()};if(!x.clientId)return alert('请选择来访者。');if(existingId)S.sessions=S.sessions.filter(z=>z.id!==existingId);S.sessionDrafts=S.sessionDrafts.filter(d=>d.id!==x.id);S.sessionDrafts.unshift(x);save();markModalClean();closeModal(true);go('sessions');toast('✓ 已保存')}

function applyTemplate(){let id=templatePick.value;if(!id)return;let t=BUILTIN_TEMPLATES.find(x=>x.id===id)||S.templates.find(x=>x.id===id);if(t){sessionEditor.innerHTML=t.content;sessionDraft()}}

function editTemplate(id=''){let t=S.templates.find(x=>x.id===id)||{id:uid(),name:'',content:''};modal(`<h2>记录模板</h2><div class="field"><label>模板名称</label><input id="tName" value="${esc(t.name)}"></div><div class="field"><label>模板内容</label><div class="toolbar"><button onclick="tfmt('bold')"><b>B</b></button><button onclick="tfmt('italic')"><i>I</i></button><button onclick="tfmt('underline')"><u>U</u></button><button onclick="tfmt('insertUnorderedList')">• 列表</button><button onclick="tfmt('insertOrderedList')">1. 列表</button><button onclick="tfmt('formatBlock','h3')">标题</button><button onclick="tfmt('formatBlock','blockquote')">引用</button></div><div id="tContent" class="editor" contenteditable="true" style="min-height:260px">${t.content||''}</div></div>${foot(`saveTemplate('${t.id}','${id}')`,'保存')}`)}

let noteQuery='',noteClientFilter='';
const noteColors=[['default','#fffdf7','默认'],['sand','#f6edcf','米黄'],['sage','#dfead9','鼠尾草绿'],['blue','#dcebf2','雾蓝'],['lavender','#e9e0f0','淡紫'],['rose','#f2dfe3','浅粉'],['clay','#edd9cf','陶土'],['gray','#e6e8e8','浅灰']];
function noteColorValue(k){return (noteColors.find(x=>x[0]===k)||noteColors[0])[1]}
function renderNotes(){let arr=[...S.quickNotes].filter(n=>(!noteClientFilter||n.clientId===noteClientFilter)&&(!noteQuery||(`${n.title||''} ${n.issues||''} ${n.content||''} ${cname(n.clientId)}`).toLowerCase().includes(noteQuery.toLowerCase()))).sort((a,b)=>(Number(b.pinned)-Number(a.pinned))||((b.updatedAt||0)-(a.updatedAt||0)));let pinned=arr.filter(n=>n.pinned),other=arr.filter(n=>!n.pinned);let board=a=>a.length?`<div class="note-board">${a.map(noteCard).join('')}</div>`:empty('这里还没有随手记。');document.getElementById('notes').innerHTML=head('随手记','卡片式瀑布流，用颜色、置顶和筛选快速整理临时笔记。','<button class="btn primary" onclick="editNote()">+ 新建随手记</button>')+`<div class="note-controls"><input style="max-width:360px" placeholder="搜索标题、内容或议题…" value="${esc(noteQuery)}" oninput="noteQuery=this.value;renderNotes()"><select style="max-width:260px" onchange="noteClientFilter=this.value;renderNotes()"><option value="">全部来访者与一般笔记</option>${S.clients.filter(c=>c.status!=='归档').map(c=>`<option value="${c.id}" ${c.id===noteClientFilter?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>${pinned.length?`<div class="note-section-label">置顶</div>${board(pinned)}`:''}<div class="note-section-label">${pinned.length?'其他':'全部随手记'}</div>${board(other)}`}
function noteCard(n){let text=esc(n.content||'').replace(/\n/g,'<br>');return `<article class="note-card" style="background:${noteColorValue(n.color)}" onclick="editNote('${n.id}')"><span class="pin">${n.pinned?'◆':''}</span><h3>${esc(n.title||'无标题')}</h3><div class="note-card-body">${text||'<span class="meta">空白笔记</span>'}</div>${n.issues?`<div style="margin-top:9px">${fmtIssues(n.issues)}</div>`:''}<div class="note-card-foot">${n.clientId?esc(cname(n.clientId))+' · ':''}${n.updatedAt?new Date(n.updatedAt).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):''}</div></article>`}

let taskFilterValue='';

function taskCard(t){return `<div class="task" data-task-id="${t.id}" tabindex="0" role="button" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();editTask('${t.id}')}" onpointerdown="startTaskPointerDrag(event,'${t.id}')" onclick="openTaskFromCard(event,'${t.id}')"><b>${esc(t.title)}</b><div class="meta">${t.clientId?esc(cname(t.clientId)):'一般任务'} ${t.due?'· '+esc(t.due):''}</div><select onpointerdown="event.stopPropagation()" onclick="event.stopPropagation()" onchange="setTaskStatus('${t.id}',this.value)">${['待处理','进行中','等待中','已完成'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div>`}

function editTask(id=''){let t=S.tasks.find(x=>x.id===id)||{id:uid(),title:'',clientId:'',status:'待处理',due:'',notes:''};modal(`<h2>任务</h2><div class="formgrid"><div class="field full"><label>任务标题</label><input id="kTitle" value="${esc(t.title)}"></div><div class="field"><label>关联来访者（可选）</label><select id="kClient">${opts(t.clientId)}</select></div><div class="field"><label>状态</label><select id="kStatus">${['待处理','进行中','等待中','已完成'].map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>截止日期</label><input id="kDue" type="date" value="${esc(t.due||'')}"></div><div class="field full"><label>备注</label><textarea id="kNotes">${esc(t.notes||'')}</textarea></div></div>${foot(`saveTask('${t.id}')`,'保存')}`)}

let taskDrag=null;let taskPointerMoved=false;
function openTaskFromCard(e,id){if(taskPointerMoved){taskPointerMoved=false;return}if(e.target.closest('select,button,input,textarea'))return;editTask(id)}
function startTaskPointerDrag(e,id){
  if(e.button!==undefined && e.button!==0)return;
  if(e.target.closest('select,button,input,textarea'))return;
  let card=e.currentTarget, r=card.getBoundingClientRect();
  let ghost=card.cloneNode(true);
  ghost.style.position='fixed'; ghost.style.left=r.left+'px'; ghost.style.top=r.top+'px';
  ghost.style.width=r.width+'px'; ghost.style.zIndex='9999'; ghost.style.pointerEvents='none';
  ghost.style.opacity='.88'; ghost.style.transform='rotate(1deg)';
  document.body.appendChild(ghost);
  card.classList.add('dragging');
  taskPointerMoved=false;taskDrag={id,card,ghost,dx:e.clientX-r.left,dy:e.clientY-r.top,startX:e.clientX,startY:e.clientY};
  card.setPointerCapture?.(e.pointerId);
  document.addEventListener('pointermove',moveTaskPointerDrag);
  document.addEventListener('pointerup',endTaskPointerDrag,{once:true});
  e.preventDefault();
}
function moveTaskPointerDrag(e){
  if(!taskDrag)return;
  if(Math.abs(e.clientX-taskDrag.startX)>5||Math.abs(e.clientY-taskDrag.startY)>5)taskPointerMoved=true;
  taskDrag.ghost.style.left=(e.clientX-taskDrag.dx)+'px';
  taskDrag.ghost.style.top=(e.clientY-taskDrag.dy)+'px';
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('drop-target'));
  let el=document.elementFromPoint(e.clientX,e.clientY);
  let col=el?.closest?.('.col');
  if(col)col.classList.add('drop-target');
}
function endTaskPointerDrag(e){
  if(!taskDrag)return;
  let el=document.elementFromPoint(e.clientX,e.clientY), col=el?.closest?.('.col');
  let id=taskDrag.id;
  taskDrag.card.classList.remove('dragging');
  taskDrag.ghost.remove();
  document.querySelectorAll('.col').forEach(c=>c.classList.remove('drop-target'));
  taskDrag=null;
  document.removeEventListener('pointermove',moveTaskPointerDrag);
  if(taskPointerMoved&&col&&col.dataset.status)setTaskStatus(id,col.dataset.status);
}
function dragTask(e,id){e.dataTransfer.setData('text/plain',id);e.currentTarget.classList.add('dragging')}

function renderCalendar(){document.getElementById('calendar').innerHTML=head('日程','默认北京时间；可在每条日程中选择其他时区。','<button class="btn primary" onclick="editEvent()">+ 添加日程</button>')+`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="tabs"><button class="${calView==='month'?'active':''}" onclick="calView='month';renderCalendar()">月</button><button class="${calView==='week'?'active':''}" onclick="calView='week';renderCalendar()">周</button><button class="${calView==='list'?'active':''}" onclick="calView='list';renderCalendar()">清单</button></div><div class="row"><button class="btn" onclick="calMove(-1)">‹</button><button class="btn" onclick="calToday()">今天</button><b>${calDate.getFullYear()}年 ${calDate.getMonth()+1}月</b><button class="btn" onclick="calMove(1)">›</button></div></div><div id="calBody">${calBody()}</div></div>`}

function calBody(){if(calView==='list'){let a=[...S.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return a.length?a.map(eventItem).join(''):emptyAction('还没有日程。','＋ 添加日程',"editEvent()")}if(calView==='week'){let d=new Date(calDate),day=d.getDay()||7;d.setDate(d.getDate()-day+1);let hours=Array.from({length:13},(_,i)=>i+8);return `<div class="week">${Array.from({length:7},(_,i)=>{let x=new Date(d);x.setDate(d.getDate()+i);let ds=localDate(x),events=S.events.filter(e=>e.date===ds);return `<div class="weekcol" onclick="editEventOnDate('${ds}')"><div class="weekhead"><b>${ds}</b></div><div class="weekhours">${hours.map(h=>`<div class="hourline"><span class="hourlabel">${String(h).padStart(2,'0')}:00</span></div>`).join('')}</div>${events.length?`<div class="weekevents">${events.map(eventPill).join('')}</div>`:''}</div>`}).join('')}</div>`}let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();let cells=Array(start).fill('<div></div>');for(let n=1;n<=days;n++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;cells.push(`<div class="day ${ds===dateToday()?'today-mark':''}" onclick="editEventOnDate('${ds}')" title="点击新增日程"><div class="num">${n}</div>${S.events.filter(e=>e.date===ds).map(eventPill).join('')}</div>`)}return `<div class="calgrid">${['一','二','三','四','五','六','日'].map(x=>`<b style="text-align:center">${x}</b>`).join('')}${cells.join('')}</div>`}
function localDate(d){let p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}
function eventPill(e){return `<div class="eventpill" onclick="event.stopPropagation();editEvent('${e.id}')">${esc(e.time||'')} ${esc(e.title||e.type)}</div>`}
function eventItem(e){return `<div class="item"><div><b>${esc(e.title||e.type)}</b><div class="meta">${esc(e.date)} ${esc(e.time||'')} · ${e.clientId?esc(cname(e.clientId)):'未关联'} · ${esc(e.mode||'')} · ${tzName(e.timezone)}</div></div><div class="row">${e.type==='心理咨询'&&e.clientId?(()=>{let sr=S.sessions.find(s=>s.eventId===e.id)||S.sessions.find(s=>s.clientId===e.clientId&&s.date===e.date);return `<button class="btn" onclick="${sr?`editSession('${sr.id}')`:`editSession('', '${e.id}')`}">${sr?'查看记录':'填写咨询记录'}</button>`})():''}<button class="btn" onclick="editEvent('${e.id}')">编辑</button></div></div>`}

function editEvent(id='',cid='',presetDate=''){let e=S.events.find(x=>x.id===id)||{id:uid(),type:'心理咨询',title:'心理咨询',clientId:cid,date:presetDate||dateToday(),time:'',mode:'视频',timezone:S.settings.timezone||'Asia/Shanghai',notes:'',recurrence:'不重复'};let fee=linkedFee(e.id)||{amount:'',status:'待收',method:'',notes:''};modal(`<h2>${id?'编辑日程':'添加日程'}</h2><div class="formgrid"><div class="field"><label>日程类型</label><select id="eType" onchange="toggleEventFee();if(this.value==='心理咨询'&&!eTitle.value)eTitle.value='心理咨询'">${['心理咨询','会议','个人事项','其他'].map(x=>`<option ${e.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>日程标题</label><input id="eTitle" value="${esc(e.title||'心理咨询')}"></div><div class="field"><label>关联来访者（可选）</label><select id="eClient" onchange="if(this.value&&eType.value==='心理咨询')eTitle.value='心理咨询'">${opts(e.clientId)}</select></div><div class="field"><label>咨询形式（可选）</label><select id="eMode">${['视频','面询','电话',''].map(x=>`<option value="${x}" ${e.mode===x?'selected':''}>${x||'不指定'}</option>`).join('')}</select></div><div class="field"><label>日期</label><input id="eDate" type="date" value="${esc(e.date)}"></div><div class="field"><label>时间</label><input id="eTime" type="time" value="${esc(e.time||'')}"></div><div class="field"><label>重复</label><select id="eRepeat">${['不重复','每周','每两周','每月'].map(v=>`<option ${e.recurrence===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>时区</label><select id="eTz">${[['Asia/Shanghai','北京时间（UTC+8）'],['America/Chicago','美国中部时间'],['America/New_York','美国东部时间'],['America/Los_Angeles','美国太平洋时间'],['Europe/London','伦敦时间']].map(([v,n])=>`<option value="${v}" ${e.timezone===v?'selected':''}>${n}</option>`).join('')}</select></div><div id="eventFeeBox" class="field full" style="display:${e.type==='心理咨询'?'block':'none'}"><div class="card" style="padding:14px"><h3 class="section-title">本次咨询费用</h3><div class="formgrid"><div class="field"><label>金额（元）</label><input id="eFeeAmount" inputmode="decimal" value="${esc(fee.amount||'')}" placeholder="例如 500"></div><div class="field"><label>收费状态</label><select id="eFeeStatus">${['待收','已收','免收费','取消'].map(x=>`<option ${fee.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>付款方式</label><select id="eFeeMethod">${['','微信支付','支付宝','银行卡 / 转账','现金','信用卡 / 借记卡','保险','其他'].map(x=>`<option ${fee.method===x?'selected':''}>${x||'未选择'}</option>`).join('')}</select></div><div class="field"><label><input id="eFeeCreate" type="checkbox" style="width:auto" ${linkedFee(e.id)||fee.amount?'checked':''}> 保存时建立 / 更新收费记录</label></div></div><div class="meta">默认状态为「待收」。收费记录会与本次咨询日程关联，不会重复建立。</div></div></div><div class="field full"><label>备注</label><textarea id="eNotes">${esc(e.notes||'')}</textarea></div></div><div class="modalfoot"><button class="btn" onclick="closeModal()">取消</button>${id?`<button class="btn danger" onclick="deleteEventFlow('${e.id}')">删除</button>`:''}<button class="btn primary" onclick="saveEvent('${e.id}')">保存</button></div>`)}
function toggleEventFee(){let b=document.getElementById('eventFeeBox');if(b)b.style.display=eType.value==='心理咨询'?'block':'none'}
function syncFeeForEvent(ev,sourceEventId=''){let create=document.getElementById('eFeeCreate')?.checked,amount=document.getElementById('eFeeAmount')?.value.trim()||'',status=document.getElementById('eFeeStatus')?.value||'待收',method=document.getElementById('eFeeMethod')?.value||'';let old=linkedFee(sourceEventId||ev.id);if(ev.type!=='心理咨询'||!ev.clientId){if(old){old.clientId=ev.clientId||old.clientId;old.date=ev.date}return}if(!create&&!old)return;if(!create&&old)return;let f=old||{id:uid(),eventId:ev.id,notes:''};Object.assign(f,{eventId:ev.id,clientId:ev.clientId,date:ev.date,amount,status,method});if(!old)S.finances.unshift(f)}
function syncSeriesFees(baseEvent){if(baseEvent.recurrence==='不重复'||!document.getElementById('eFeeCreate')?.checked)return;if(!confirm('是否将相同的费用设置应用到这组重复咨询的所有已生成日程？'))return;let sid=baseEvent.seriesId||baseEvent.id;S.events.filter(e=>(e.id===sid||e.seriesId===sid)&&e.type==='心理咨询'&&e.clientId).forEach(e=>{let f=linkedFee(e.id)||{id:uid(),eventId:e.id,notes:''};Object.assign(f,{eventId:e.id,clientId:e.clientId,date:e.date,amount:eFeeAmount.value.trim(),status:eFeeStatus.value,method:eFeeMethod.value});if(!linkedFee(e.id))S.finances.unshift(f)})}
function saveEvent(id){let x={id,type:eType.value,title:eTitle.value.trim()||(eType.value==='心理咨询'?'心理咨询':eType.value),clientId:eClient.value,mode:eMode.value,date:normDate(eDate.value),time:eTime.value,timezone:eTz.value,recurrence:eRepeat.value,notes:eNotes.value};if(!x.date)return alert('请填写日期。');if(x.type==='心理咨询'&&document.getElementById('eFeeCreate')?.checked&&!x.clientId)return alert('建立收费记录前，请先关联来访者。');let conflict=S.events.find(e=>e.id!==id&&e.date===x.date&&e.time&&x.time&&e.time===x.time);if(conflict&&!confirm(`同一时间已有日程「${conflict.title||conflict.type}」。仍要保存吗？`))return;let old=S.events.find(e=>e.id===id),i=S.events.findIndex(e=>e.id===id),saved=x;if(old&&(old.seriesId||S.events.some(z=>z.seriesId===old.id))){let scope=prompt('重复日程：输入 1 仅修改本次；2 修改本次及之后。','1');if(scope==='2'){let sid=old.seriesId||old.id;S.events.forEach(z=>{if((z.id===sid||z.seriesId===sid)&&z.date>=old.date)Object.assign(z,{type:x.type,title:x.title,clientId:x.clientId,mode:x.mode,time:x.time,timezone:x.timezone,notes:x.notes,recurrence:x.recurrence})});S.events[i].date=x.date;saved=S.events[i]}else{S.events[i]={...old,...x};saved=S.events[i]}}else if(i>=0){S.events[i]=x;saved=x}else{S.events.unshift(x);saved=x;if(x.recurrence!=='不重复')createRecurringEvents(x,12)}syncFeeForEvent(saved,id);syncSeriesFees(saved);save();markModalClean();closeModal(true);render();toast('✓ 日程与收费已保存')}
function deleteEventFlow(id){let e=S.events.find(x=>x.id===id);if(!e)return;let sid=e.seriesId||e.id,isSeries=!!(e.seriesId||S.events.some(x=>x.seriesId===e.id)),ids=[];if(!isSeries){if(!confirm('确定删除该日程吗？'))return;ids=[id];S.events=S.events.filter(x=>x.id!==id)}else{let scope=prompt('重复日程：输入 1 仅删除本次；2 删除本次及之后；3 删除整个系列。','1');if(scope==='1'){ids=[id];S.events=S.events.filter(x=>x.id!==id)}else if(scope==='2'){ids=S.events.filter(x=>(x.id===sid||x.seriesId===sid)&&x.date>=e.date).map(x=>x.id);S.events=S.events.filter(x=>!ids.includes(x.id))}else if(scope==='3'){ids=S.events.filter(x=>x.id===sid||x.seriesId===sid).map(x=>x.id);S.events=S.events.filter(x=>!ids.includes(x.id))}else return}let linked=S.finances.filter(f=>ids.includes(f.eventId));if(linked.length&&confirm(`这些日程关联 ${linked.length} 条收费记录。是否同时删除关联的收费记录？\n选择“取消”将保留收费记录。`))S.finances=S.finances.filter(f=>!ids.includes(f.eventId));save();markModalClean();closeModal(true);render();toast('✓ 已保存')}

}
function saveReferral(id){let x={id,name:rName.value.trim(),type:rType.value,specialty:rSpecialty.value.trim(),insurance:rInsurance.value.trim(),location:rLocation.value.trim(),phone:rPhone.value.trim(),email:rEmail.value.trim(),notes:rNotes.value.trim(),favorite:rFavorite.checked};if(!x.name)return alert('请输入姓名或机构名称。');S.referrals=S.referrals||[];let i=S.referrals.findIndex(r=>r.id===id);if(i>=0)S.referrals[i]=x;else S.referrals.unshift(x);save();markModalClean();closeModal(true);renderReferrals();toast('✓ 已保存')}
function deleteReferral(id){let i=S.referrals.findIndex(r=>r.id===id);if(i<0)return;let old=S.referrals[i];S.referrals.splice(i,1);save();renderReferrals();toast('转介资源已删除',()=>{S.referrals.splice(i,0,old);save();renderReferrals()})}
function toggleReferralFavorite(id){let r=(S.referrals||[]).find(x=>x.id===id);if(r){r.favorite=!r.favorite;save();renderReferrals()}}
function exportReferrals(){let rows=[['名称','类别','专长领域','保险','地区','电话','邮箱','备注','常用'],...(S.referrals||[]).map(r=>[r.name,r.type,r.specialty,r.insurance,r.location,r.phone,r.email,r.notes,r.favorite?'是':'否'])];let csv='\uFEFF'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`转介网络_${dateToday()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function printReferrals(){let a=S.referrals||[],w=window.open('','_blank','width=1000,height=760'),org=esc(S.settings.practiceName||''),tool=esc(S.settings.toolName||'心理咨询师工作台');w.document.write(`<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>转介网络</title><style>@page{margin:16mm}body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#222;line-height:1.5}h1{margin-bottom:2px}.sub{color:#777;margin-bottom:18px}.r{break-inside:avoid;border-bottom:1px solid #ddd;padding:10px 0}.r b{font-size:15px}.m{font-size:12px;color:#555}.footer{position:fixed;bottom:3mm;left:16mm;right:16mm;text-align:center;font-size:10px;color:#888}</style></head><body><h1>转介网络</h1><div class="sub">${tool} · 共 ${a.length} 项资源</div>${a.map(r=>`<div class="r"><b>${r.favorite?'★ ':''}${esc(r.name)}</b><div class="m">${esc(r.type)}${r.specialty?' · 专长：'+esc(r.specialty):''}${r.insurance?' · 保险：'+esc(r.insurance):''}</div><div class="m">${r.location?'地区：'+esc(r.location)+'　':''}${r.phone?'电话：'+esc(r.phone)+'　':''}${r.email?'邮箱：'+esc(r.email):''}</div>${r.notes?`<div class="m">备注：${esc(r.notes)}</div>`:''}</div>`).join('')}${org?`<div class="footer">${org}</div>`:''}<script>setTimeout(()=>window.print(),250)<\/script></body></html>`);w.document.close()}

function exportRows(rows,name){let csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${name}_${dateToday()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportClientsCSV(){exportRows([['姓名','出生日期','首次咨询日期','状态','议题'],...S.clients.map(c=>[c.name,c.dob,c.firstDate,c.status,c.issues])],'来访者名单')}
function exportFinanceCSV(){exportRows([['日期','来访者','金额','状态','备注'],...S.finances.map(f=>[f.date,cname(f.clientId),f.amount,f.status,f.notes])],'收费记录')}
function exportTasksCSV(){exportRows([['任务','来访者','截止日期','状态','备注'],...S.tasks.map(t=>[t.title,cname(t.clientId),t.due,t.status,t.notes])],'任务')}
function renderData(){let has=S.clients.length+S.sessions.length+S.events.length+S.tasks.length+S.finances.length+S.quickNotes.length+S.referrals.length;document.getElementById('data').innerHTML=head('数据中心','数据仅保存在当前浏览器。清除浏览器数据、重置浏览器或设备故障可能造成数据丢失。')+`<div class="grid g2"><div class="card"><h3 class="section-title">完整备份</h3><button class="btn primary" onclick="backup()">导出完整备份</button><div class="meta">${S.backupMeta.lastBackup?'上次备份：'+new Date(S.backupMeta.lastBackup).toLocaleString('zh-CN'):(has?'尚未记录完整备份':'目前没有工作数据')}</div></div><div class="card"><h3 class="section-title">恢复备份</h3><input type="file" id="restoreFile" accept=".json"><button class="btn" onclick="restore()">恢复备份</button></div></div><div class="card" style="margin-top:12px"><h3>数据健康检查</h3><button class="btn" onclick="showDataHealth()">检查待处理项目</button></div><div class="card" style="margin-top:12px"><h3>分类导出</h3><div class="row"><button class="btn" onclick="exportClientsCSV()">来访者名单 CSV</button><button class="btn" onclick="exportFinanceCSV()">收费记录 CSV</button><button class="btn" onclick="exportTasksCSV()">任务 CSV</button><button class="btn" onclick="exportReferrals()">转介网络 CSV</button></div><div class="meta">单个来访者档案可从来访者详情页导出。</div></div><div class="card" style="margin-top:16px"><h3>清除本地数据</h3><button class="btn danger" onclick="clearData()">清除工作数据</button></div>`}
function backup(){S.backupMeta.lastBackup=Date.now();save();let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`心理咨询师工作台备份_${dateToday()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);render()}
function restore(){let f=restoreFile.files[0];if(!f)return alert('请选择备份文件。');if(!confirm('恢复将覆盖当前工作台数据，确认继续？'))return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.clients))throw 0;S=Object.assign(emptyState(),x);normalizeV17();save();applySettings();alert('恢复完成。');go('today')}catch{alert('备份文件无法识别。')}};r.readAsText(f)}
function clearData(){if(confirm('确认清除全部工作数据？此操作无法撤销。')){let settings=S.settings;S=emptyState();S.settings=settings;save();go('today')}}
function renderSettings(){document.getElementById('settings').innerHTML=head('个性化设置','调整工作台名称、主题色、显示模式和自动锁定。')+`<div class="card"><div class="formgrid"><div class="field"><label>咨询师姓名</label><input id="setOwner" value="${esc(S.settings.ownerName||'')}"></div><div class="field"><label>工具名称</label><input id="setToolName" value="${esc(S.settings.toolName||'心理咨询师工作台')}"></div><div class="field"><label>机构 / 工作室名称</label><input id="setPractice" value="${esc(S.settings.practiceName||'')}"></div><div class="field full"><label>工作台图标</label><div class="icon-choices">${['✦','✧','★','☆','✶','✷','✹','✺','♥','♡','❥','❦','●','○','◆','◇','◈','☀','☾','☁','❋','❖'].map(x=>`<button type="button" class="icon-choice ${((S.settings.workbenchIcon||S.settings.mobileIcon||'✦')===x)?'selected':''}" data-icon="${x}" onclick="pickWorkbenchIcon(this)">${x}</button>`).join('')}</div><input type="hidden" id="setWorkbenchIcon" value="${esc(S.settings.workbenchIcon||S.settings.mobileIcon||'✦')}"><div class="meta" style="margin-top:6px">选择顶部左侧显示的工作台图标。</div></div><div class="field full"><label>主题色</label><div class="theme-swatches" id="themeSwatches">
${[['#315f6b','雾蓝绿'],['#365f8d','沉静蓝'],['#526b5c','鼠尾草绿'],['#735b7d','灰紫'],['#8a5d4d','陶土棕'],['#3f5d68','石板蓝']].map(([v,n])=>`<button type="button" class="theme-swatch ${S.settings.accent===v?'selected':''}" style="--sw:${v}" data-color="${v}" onclick="pickTheme(this)"><span></span>${n}</button>`).join('')}
</div><div class="row" style="margin-top:8px"><label style="font-weight:500">自定义</label><input id="setAccent" type="color" value="${esc(S.settings.accent||'#315f6b')}" style="width:52px;height:38px;padding:3px"></div></div><div class="field"><label>隐私模式</label><label style="font-weight:500"><input id="setPrivacy" type="checkbox" style="width:auto" ${S.settings.privacy?'checked':''}> 临时隐藏来访者姓名</label></div><div class="field"><label>闲置自动锁定</label><select id="setLock">${[['0','不自动锁定'],['5','5 分钟'],['10','10 分钟'],['15','15 分钟'],['30','30 分钟'],['60','60 分钟']].map(([v,n])=>`<option value="${v}" ${String(S.settings.autoLock)===v?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>默认时区</label><select id="setTz"><option value="Asia/Shanghai">北京时间（UTC+8）</option></select></div></div><button class="btn primary" style="margin-top:12px" onclick="saveSettings()">保存设置</button></div>`}
function pickTheme(b){document.querySelectorAll('.theme-swatch').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');setAccent.value=b.dataset.color;document.documentElement.style.setProperty('--accent',b.dataset.color)}
function pickWorkbenchIcon(b){document.querySelectorAll('.icon-choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');setWorkbenchIcon.value=b.dataset.icon;document.querySelector('.brand').textContent=b.dataset.icon}
function saveSettings(){S.settings.ownerName=setOwner.value.trim();S.settings.toolName=setToolName.value.trim()||'心理咨询师工作台';S.settings.practiceName=setPractice.value.trim();S.settings.workbenchIcon=setWorkbenchIcon.value;S.settings.accent=setAccent.value;S.settings.autoLock=Number(setLock.value);S.settings.timezone=setTz.value;S.settings.privacy=!!setPrivacy.checked;save();applySettings();resetIdle();toast('✓ 设置已保存')}
function applySettings(){document.documentElement.style.setProperty('--accent',S.settings.accent||'#315f6b');document.body.classList.toggle('dark',!!S.settings.dark);document.querySelector('.brand').textContent=S.settings.workbenchIcon||S.settings.mobileIcon||'✦';document.body.classList.toggle('privacy-on',!!S.settings.privacy);let pb=document.getElementById('privacyBtn');if(pb)pb.textContent=S.settings.privacy?'◎':'◉'}
function toggleDark(){S.settings.dark=!S.settings.dark;save();applySettings()}
let modalDirty=false;
function modal(content){modalDirty=false;document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`;let m=document.querySelector('#modalRoot .modal');if(m){m.addEventListener('input',()=>modalDirty=true);m.addEventListener('change',()=>modalDirty=true);setTimeout(()=>{let f=m.querySelector('input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea:not([disabled]),[contenteditable=true]');if(f&&!f.closest('.toolbar'))f.focus({preventScroll:true})},30)}}
function markModalClean(){modalDirty=false}
function closeModal(force=false){if(!force&&modalDirty&&!confirm('当前窗口有尚未保存的修改。确定放弃吗？'))return false;document.getElementById('modalRoot').innerHTML='';modalDirty=false;return true}
function foot(action,label){return `<div class="modalfoot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="${action}">${label}</button></div>`}
function toast(msg,undo){let box=document.getElementById('toastbox');if(!box)return;let d=document.createElement('div');d.className='toast';d.innerHTML=esc(msg)+(undo?`<button>撤销</button>`:'');if(undo)d.querySelector('button').onclick=()=>{undo();d.remove()};box.appendChild(d);setTimeout(()=>d.remove(),3200)}
function toggleQuickMenu(){document.getElementById('quickMenu').classList.toggle('hidden')}
function quickAdd(k){document.getElementById('quickMenu').classList.add('hidden');({session:()=>editSession(),event:()=>editEvent(),task:()=>editTask(),note:()=>editNote(),client:()=>editClient(),finance:()=>editFinance()}[k]||(()=>{}))()}
function toggleMobileMore(){document.querySelector('.nav')?.style.setProperty('display','flex');setTimeout(()=>{document.querySelector('.nav')?.style.removeProperty('display')},6000)}
function togglePrivacy(){S.settings.privacy=!S.settings.privacy;save();applySettings();render();toast(S.settings.privacy?'隐私模式已开启':'隐私模式已关闭')}
function openGlobalSearch(){go('search');setTimeout(()=>document.getElementById('globalQ')?.focus(),0)}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openGlobalSearch();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&document.getElementById('modalRoot').innerHTML){e.preventDefault();let b=document.querySelector('#modalRoot .modalfoot .btn.primary');if(b&&!b.disabled)b.click();return}if(e.key==='Escape'&&document.getElementById('modalRoot').innerHTML)closeModal()})
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)}
function auth(){try{return JSON.parse(localStorage.getItem(AUTH)||'null')}catch{return null}}
function initAuth(){let a=auth(),lockEl=document.getElementById('lock');lockEl.classList.remove('hidden');if(!a){lockTitle.textContent='首次使用';lockSub.textContent='创建启动密码。';setupName.classList.remove('hidden');confirmWrap.classList.remove('hidden')}else{lockTitle.textContent='心理咨询师工作台';lockSub.textContent='输入启动密码进入工作台。'}lockPassword.focus()}
function unlock(){let a=auth(),p=lockPassword.value;if(!a){if(p.length<6)return lockError.textContent='启动密码至少 6 位。';if(p!==lockConfirm.value)return lockError.textContent='两次输入的密码不一致。';let salt=uid();localStorage.setItem(AUTH,JSON.stringify({salt,hash:hash(salt+p)}));S.settings.ownerName=ownerName.value.trim();save();document.getElementById('lock').classList.add('hidden')}else if(hash(a.salt+p)===a.hash){document.getElementById('lock').classList.add('hidden');lockPassword.value='';lockError.textContent=''}else return lockError.textContent='密码不正确。';resetIdle()}
function lockNow(){closeModal();setupName.classList.add('hidden');confirmWrap.classList.add('hidden');lockTitle.textContent='心理咨询师工作台';lockSub.textContent='输入启动密码进入工作台。';lockError.textContent='';document.getElementById('lock').classList.remove('hidden');lockPassword.value='';lockConfirm.value='';lockPassword.focus()}
function togglePw(id,b){let x=document.getElementById(id);x.type=x.type==='password'?'text':'password';b.textContent=x.type==='password'?'◉':'◎'}
function resetIdle(){clearTimeout(idleTimer);let m=Number(S.settings.autoLock||0);if(m>0&&document.getElementById('lock').classList.contains('hidden'))idleTimer=setTimeout(lockNow,m*60000)}
['mousemove','keydown','click','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(document.getElementById('lock').classList.contains('hidden'))resetIdle()},{passive:true}))
lockPassword?.addEventListener('keyup',e=>{caps.classList.toggle('hidden',!e.getModifierState('CapsLock'));if(e.key==='Enter')unlock()});
function bootstrap(){
 try{
  normalizeV17();
  applySettings();
  go('today');
  initAuth();
 }catch(err){
  console.error('工作台启动失败',err);
  const sec=document.getElementById('today');
  if(sec){sec.classList.add('active');sec.innerHTML='<div class="pagehead"><div><h1>今日工作台</h1><div class="sub">工作台启动时遇到错误。</div></div></div><div class="card"><b>无法正常载入页面</b><div class="sub" style="margin-top:8px">请保留此 HTML 文件，并打开浏览器开发者工具查看错误信息。工作台不会自动清除本地数据。</div><pre style="white-space:pre-wrap;margin-top:12px">'+esc(err&&err.message?err.message:String(err))+'</pre></div>'}
 }
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',bootstrap);else bootstrap();
</script>
